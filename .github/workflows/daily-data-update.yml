# Daily Market Data Update — Fluxus Capital Dashboard
# Cherry-picked structure from traderwillhu/market_dashboard refresh_data.yml
# Enhanced with: Discord webhook, validation step, proper timezone handling
name: Daily Market Data Update

on:
  schedule:
    # 16:20 ET = 20:20 UTC Mon-Fri. The pipeline's own gate opens at 16:15 ET
    # (run_all.py:454-464), so this is the earliest slot it will accept, and
    # GitHub's cron only ever fires late, never early. Was '30 21' (16:30 ET
    # +1h) until 2026-09-05; Andy moved it up 70 minutes because the front page
    # is time-sensitive and should show the close as soon as it exists.
    # NOT :30 on purpose -- on-the-hour and half-hour slots are the busiest on
    # GitHub's scheduler; an odd minute is a cheap hedge against queueing.
    # ⚠️ UNVERIFIED: nobody has measured whether Finviz/Yahoo have settled
    # official closes by 16:20 ET. Monday's first run under this schedule must
    # be checked against an independent source before its data is trusted.
    - cron: '20 20 * * 1-5'
    # BACKSTOP, four hours later (21:30 ET the same session). GitHub dropped
    # the 2026-08-27 run outright — no queued entry, nothing in the run list.
    # That is the FIRST miss in 49 business days: over 2026-06-19 → 2026-08-26
    # every scheduled run fired, median 63 min late, worst 213 min. At 327 min
    # past due with no record, it was dropped rather than queued, and a dropped
    # run never self-heals: the only reason 08-24 and 08-25 have data is that a
    # human pressed the button. This second schedule exists so that stops being
    # true. The `gate` job below decides whether it has anything to do.
    - cron: '30 1 * * 2-6'
  workflow_dispatch: # Manual trigger for testing

permissions:
  contents: write  # Required for git push to work

# One run of this workflow at a time; a second one WAITS, it is never
# cancelled mid-flight (cancel-in-progress: false). 2026-09-09 is why: the
# sentinel dispatched run 34411547131 at 22:18Z because the 20:20Z schedule
# had not fired; the schedule finally fired at 22:37:32Z (137 min late) as run
# 34413142036, whose gate finished at 22:37:48Z -- NINE SECONDS BEFORE the
# dispatch committed 0d0acf76 (22:37:57Z). No test of breadth.json, however
# fresh, can see a session that is still being written. Serialised, the late
# run's gate starts after the dispatch has pushed, and the check below finds
# the landed session. (A third arrival while one run is pending replaces the
# pending one -- GitHub keeps one pending run per group. Only the run that
# would have been the duplicate can be dropped that way.)
concurrency:
  group: daily-data-update
  cancel-in-progress: false


jobs:
  # Does this run have anything to do?
  #
  # A manual dispatch always runs: a human pressed the button, and the gate
  # does not second-guess them.
  #
  # BOTH schedules ask the same question -- is the session we are after
  # already on main? -- and skip only if it is. The main schedule used to be
  # exempt ("a gate that can silently skip the main run would be worse than
  # the problem it fixes"). That was the right call while nothing else could
  # land a session, and it stopped being right once the sentinel started
  # dispatching when the main schedule was late: GitHub fires `20 20` up to
  # 2+ hours late, the sentinel has already caught the night up by then, and
  # the late schedule recomputed it anyway (2026-08-27, 09-08, 09-09). The 09-09
  # rerun hit the GAS 30 s timeout in shortlist_feedback.py:44, audit_ledger
  # called it a regression on the previous session, and the night went red for
  # a duplicate -- 20 runner-minutes and a full Finviz/Yahoo pass spent on
  # data main already had, from an IP Yahoo has 401'd before.
  #
  # Opening the gate on the main schedule is safe because:
  #   - it can only skip when breadth.json's newest session EQUALS the one it
  #     wants -- i.e. the close is already on main. The pipeline refuses to run
  #     between 04:00 and 16:15 ET on a session day (run_all.py main()), so a
  #     session that has landed is a post-close session; there is nothing
  #     better for a rerun to fetch;
  #   - it is not silent: a skip prints a ::notice:: naming the session;
  #   - it FAILS OPEN exactly like the backstop: any doubt (missing or broken
  #     file, unreachable origin) leaves LAST empty or older, which runs.
  #
  # The test is deliberately dependency-free (`date` + `git`, not marketcal):
  # this job must not be able to fail for a reason of its own. On a US holiday
  # the file will not carry the wanted date and the run proceeds -- the
  # pipeline itself refuses a non-session, which is the right place for that
  # decision, not here.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v6
      - id: decide
        run: |
          EVENT='${{ github.event_name }}'
          SCHEDULE='${{ github.event.schedule }}'
          if [ "$EVENT" != 'schedule' ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch ($EVENT) — always run"
            exit 0
          fi
          # Keyed on the backstop's cron, not the main one's: if someone moves
          # the main schedule and forgets this line, the main run still gets
          # the (fail-open) landed check below, instead of losing it silently.
          if [ "$SCHEDULE" = '30 1 * * 2-6' ]; then MODE=backstop; else MODE=main; fi
          # 触发时刻不可信：scheduled run 中位迟到 63 分钟、最差 213 分钟（本仓库
          # 08-27 主排程那班更是迟了 485 分钟），而 01:30 UTC 距 ET 午夜只有 150
          # 分钟。用执行时刻的 ET 日期，一旦迟到超过 150 分钟 WANT 就翻成下一个
          # 日历日,那个日期永远不在 breadth.json 里,闸于是恒开——backstop 会把
          # 一个已经落地的夜晚重算一遍。回退 6 小时把容差从 150 分钟拉到 8h30m:
          # 准点触发时 now-6h = 19:30 ET 同日,仍然是我们要找的那个 session;迟到
          # 到 10:00 UTC 才会再次翻日,而那时这一晚本来也已经报废了。GitHub 的
          # cron 只会迟不会早,所以下界不用管。GATE_NOW_EPOCH 是测试用的注入口
          # (pipeline/tests/test_backstop_gate.py),正常运行时未设置。
          # 主排程 20:20 UTC 同一算式:now-6h 的 ET 日期在次日 10:00 UTC(EST
          # 11:00)之前都是当天 session,容差 13 小时以上;下界同样不用管。
          NOW_EPOCH="${GATE_NOW_EPOCH:-$(date -u +%s)}"
          WANT=$(TZ=America/New_York date -d "@$((NOW_EPOCH - 21600))" +%F)
          # Read breadth.json from origin/main AS IT IS NOW, not from the
          # checkout. The checkout is `github.sha`, frozen when the event was
          # created: run 34413142036 (09-09) checked out 5f501dd1, the commit
          # BEFORE the dispatch's data -- so a checkout-only read could never
          # have seen the landed session even after the dispatch had pushed.
          # The checkout copy stays as the fallback for an unreachable origin;
          # it is older than main, so it can only err towards running.
          # python3, not python: the runner is guaranteed the former. And it
          # FAILS OPEN — a missing or malformed breadth.json leaves LAST empty,
          # which is a mismatch, which runs. Under `bash -e` a bare command
          # substitution would have failed this job instead, and a failed gate
          # skips update-data: the file being broken is exactly when the run
          # must not sit out.
          NEWEST="import json,sys;print(json.load(sys.stdin)['conditions']['history'][-1]['date'])"
          LAST=""
          if git fetch --quiet --depth=1 origin main 2>/dev/null; then
            LAST=$(git show FETCH_HEAD:data/output/breadth.json 2>/dev/null | python3 -c "$NEWEST" 2>/dev/null || echo "")
            SRC="origin/main"
          fi
          if [ -z "$LAST" ]; then
            LAST=$(python3 -c "$NEWEST" 2>/dev/null < data/output/breadth.json || echo "")
            SRC="checkout (origin/main unreadable)"
          fi
          echo "$MODE: newest session in breadth.json [$SRC] = $LAST, looking for $WANT"
          if [ "$LAST" = "$WANT" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            if [ "$MODE" = backstop ]; then
              echo "::notice::Backstop skipped — $WANT already landed."
            else
              echo "::notice::Main schedule skipped — $WANT already landed (fired late after a manual dispatch)."
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            if [ "$MODE" = backstop ]; then
              echo "::warning::Backstop firing — $WANT missing (newest is $LAST). The 20:20 UTC main run was dropped or failed."
            else
              echo "main schedule: $WANT not on main yet (newest is $LAST) — running"
            fi
          fi

  update-data:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 45, not 15: run_all alone is ~14 min since 2026-08-17 (fundamentals
    # 700/night, bar-consistency retry, structure pivots); the 08-17 run was
    # killed at 15 with everything computed and nothing committed.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      # tvdatafeed (anonymous TradingView websocket) feeds the regime ledger's
      # NHNL and credit lamps (pipeline/risk/regime_ledger.py). A failed
      # install must be VISIBLE (red step + error annotation) but must not
      # block the market pipeline: the ledger degrades to the committed CSVs
      # and prints its own ::warning annotations for 7-day staleness.
      - name: Install tvdatafeed (regime ledger lamps)
        continue-on-error: true
        run: |
          pip install "git+https://github.com/rongardF/tvdatafeed.git" || {
            echo "::error title=tvdatafeed install failed::regime_ledger NHNL/credit lamps will run on committed CSVs and go absent after 7 stale days"
            exit 1
          }

      - name: Run data pipeline
        env:
          # 400, not 700, on the runner: the same Yahoo wall the Mac hits at
          # ~1,100 info calls -- run_all's fundamentals + the OHLC store's
          # info calls + the Delayed-EP scan all share it (03:34Z 2026-08-18
          # every later step was 429). ~14 nights per full pass; quarterly data.
          FUNDAMENTALS_BUDGET: '400'
          # shortlist feedback pull (button half of the loop) reads these in
          # run_all; they were step-scoped to trade post-mortems only, so the
          # first night (08-21) silently skipped the pull
          FLUXUS_GAS_URL: ${{ secrets.FLUXUS_GAS_URL }}
          FLUXUS_SYNC_TOKEN: ${{ secrets.FLUXUS_SYNC_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
          TZ: UTC
        run: python -m pipeline.screeners.run_all

      # The trade journal read a file last generated by hand on 2026-05-25 and
      # was 84 days stale before anyone noticed, because nothing ever ran the
      # generator. It runs here now, straight off the Sheet the browser writes
      # to — the CSV in data/portfolio/ is no longer in the path.
      #
      # continue-on-error, and only when the secrets exist: the post-mortems
      # depend on an external Apps Script that cold-starts and can time out,
      # and a book that is one day stale is a smaller problem than a market
      # pipeline that does not publish. The step's own failure is visible in
      # the run; the freshness of the output is asserted below.
      # The per-ticker OHLC store (data/output/tickers/) was refreshed by hand
      # from a CSV export, so every name opened after the last export had no
      # OHLC and the post-mortems skipped it -- 7/355 on 2026-08-16, all of
      # them current open positions. Portfolio names now come straight off the
      # Sheet (open + closed within 90 days) plus the top-25 heat list. Runs
      # BEFORE the post-mortems so they find the bars.
      # --refresh-existing: names that leave the rolling set otherwise freeze
      # silently (90/191 files sat at a 2026-08-07 last bar on 08-23; 46 had
      # sat at 05-22 for 2.5 months before that). See pipeline/tickers/staleness.py.
      - name: Refresh ticker OHLC store (Sheet positions + heat list + stored)
        continue-on-error: true
        run: |
          if [ -z "$FLUXUS_GAS_URL" ] || [ -z "$FLUXUS_SYNC_TOKEN" ]; then
            # LOUD, not quiet. This step lost its `env:` block on 2026-08-23
            # (it was moved to the staleness step inserted right below it) and
            # then skipped silently every night for five days: the ticker store
            # went from 47% frozen to 100% frozen while the run stayed green.
            # A skip that looks like a pass is how a fix becomes an outage.
            echo "::error title=Ticker refresh skipped::FLUXUS_GAS_URL/FLUXUS_SYNC_TOKEN not visible to this step — the OHLC store is NOT being refreshed"
            exit 0
          fi
          python -m pipeline.tickers.run_tickers --source sheet --refresh-existing
        env:
          PYTHONPATH: ${{ github.workspace }}
          TZ: UTC
          FLUXUS_GAS_URL: ${{ secrets.FLUXUS_GAS_URL }}
          FLUXUS_SYNC_TOKEN: ${{ secrets.FLUXUS_SYNC_TOKEN }}

      # Freshness of the store the step above just wrote.
      # `--fail` + `continue-on-error` on purpose: RED but NON-BLOCKING. The
      # report-only version printed "100.0% stale" for five nights and nobody
      # acted, because a green run is read as a fine run. Blocking publication
      # over a stale side-store would be the opposite mistake -- the market
      # data is fine. Loud-but-not-fatal is the third option this pipeline
      # was missing (five nights, four different blocking gates, 2026-08-24..28).
      - name: Ticker store staleness report
        continue-on-error: true
        run: python -m pipeline.tickers.staleness --fail --max-stale-share 0.10
        env:
          PYTHONPATH: ${{ github.workspace }}
          TZ: UTC
          FLUXUS_GAS_URL: ${{ secrets.FLUXUS_GAS_URL }}
          FLUXUS_SYNC_TOKEN: ${{ secrets.FLUXUS_SYNC_TOKEN }}

      - name: Refresh trade post-mortems
        continue-on-error: true
        run: |
          # Guarded in the shell, not in `if:` — a step's own `env:` block is
          # not in scope for its own `if:` expression, so the obvious
          # `if: env.FLUXUS_GAS_URL != ''` is always false and the step never
          # runs. Failing that way would have reproduced the exact bug this
          # step exists to fix.
          if [ -z "$FLUXUS_GAS_URL" ] || [ -z "$FLUXUS_SYNC_TOKEN" ]; then
            echo "Sheets credentials not configured — skipping post-mortems."
            exit 0
          fi
          python -m pipeline.portfolio.trade_postmortem
        env:
          PYTHONPATH: ${{ github.workspace }}
          TZ: UTC
          FLUXUS_GAS_URL: ${{ secrets.FLUXUS_GAS_URL }}
          FLUXUS_SYNC_TOKEN: ${{ secrets.FLUXUS_SYNC_TOKEN }}

      # Delayed-EP watch: append today's stage for every EP fired 3-15 sessions
      # ago, so the classifier's thresholds can be judged on outcomes after a
      # few days instead of on one snapshot. Optional -- never fails the run.
      - name: Archive Delayed-EP stages
        continue-on-error: true
        run: python -m pipeline.tools.delayed_ep_scan --archive --quiet-print
        env:
          PYTHONPATH: ${{ github.workspace }}
          TZ: UTC

      # Archive invariants (pipeline/tools/audit_archives.py): every history
      # file keyed by a real, past-or-current session, no duplicate keys, no
      # stale index bar. A violation fails the job BEFORE the commit step, so
      # main keeps yesterday's data (plan B) and the Discord failure fires.
      - name: Audit archives
        run: python -m pipeline.tools.audit_archives --json data/history/audit_last.json

      # Ledger invariants (pipeline/tools/audit_ledger.py): did tonight's run
      # actually do its job, and does each guard's evidence back up its status
      # word. Runs AFTER the pipeline step so tonight's line exists; a
      # violation fails the job before the commit step, same plan B as above.
      - name: Audit run ledger
        run: python -m pipeline.tools.audit_ledger --json data/history/audit_ledger_last.json

      # Claim registry (RESEARCH_PROTOCOL.md): a research claim that gates
      # behaviour must have survived a holdout, or carry a waiver whose
      # deadline has not passed. Expired waivers turn this step red by
      # themselves -- that is the point.
      - name: Claim registry check
        run: python -m pipeline.tools.claim_registry --check

      # Schema drift is reported, not fatal: new columns land on purpose and
      # DATA_CONTRACTS.md is where they get announced; accept with --update.
      - name: Schema snapshot check
        run: python -m pipeline.tools.schema_snapshot --check

      - name: Validate outputs
        run: |
          echo "Validating output files..."
          EXPECTED_FILES=(
            "data/output/signals.json"
            "data/output/etf_data.json"
            "data/output/momentum_97.json"
            "data/output/gainers_4pct.json"
            "data/output/vol_up_gainers.json"
            "data/output/ema21_watch.json"
            "data/output/healthy_charts.json"
            "data/output/episodic_pivot.json"
            "data/output/stockbee_ratio.json"
            "data/output/vcp.json"
            "data/output/breadth.json"
            "data/output/groups.json"
            "data/output/rotation.json"
            "data/output/watchlist.json"
          )
          FAIL=0
          for f in "${EXPECTED_FILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty or missing"
              FAIL=1
            else
              echo "OK: $f ($(wc -c < "$f") bytes)"
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "Validation FAILED"
            exit 1
          fi
          echo "All output files validated successfully"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/reference/fundamentals.json is the rolling F-score store: without
          # committing it every night re-reads the same 700 names.
          # data/reference/breadth_tv/ + SqueezeMetrics/DIX.csv are the regime
          # ledger's lamp inputs, refreshed in-run; committing keeps the
          # fallback baseline fresh so a later tvdatafeed outage degrades from
          # "yesterday", not from the last hand-run.
          # shortlist_manual.json is REFRESHED BY THE RUN (shortlist_feedback
          # rewrites it from the Sheet's starred/noted rows), so it belongs
          # here with the other in-run-refreshed reference files. Leaving it
          # out cost the 2026-08-25 backfill its first push -- and quietly
          # discarded the refresh every night before that: the stars were
          # pulled, the list was rebuilt, and the rebuild was thrown away.
          git add data/output/ data/history/ data/reference/fundamentals.json \
                  data/reference/breadth_tv/ data/reference/shortlist_manual.json \
                  SqueezeMetrics/DIX.csv
          git diff --staged --quiet && exit 0
          git commit -m "chore: market data $(date +%Y-%m-%d)"
          # Anything the run touched OUTSIDE the staged set blocks the rebase
          # below ("cannot rebase: You have unstaged changes") and the whole
          # night is lost with the commit already made -- 2026-08-25, after
          # the schema fix had finally let the run get this far. Say what it
          # was, so the next occurrence is diagnosed rather than guessed at.
          leftover=$(git status --porcelain)
          if [ -n "$leftover" ]; then
            echo "::warning title=Unstaged after commit::$(echo "$leftover" | tr '\n' ' ')"
            echo "left unstaged after the data commit:"; echo "$leftover"
          fi
          # main moves while this runs (2026-08-18: five commits landed during
          # a 20-minute run and the push was rejected). Rebase onto whatever
          # is there now and retry; our commit only touches data files.
          # --autostash: a stray dirty file must not cost the night's data.
          # (Safe here in a way it never is on the shared worktree: this
          # runner is ephemeral and nobody else is working in it.)
          for i in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main && git push && exit 0
            git rebase --abort || true
            sleep 15
          done
          echo "push failed after 3 rebase attempts"; exit 1

      # "Do not publish" and "do not keep" are different things, and until now
      # this workflow only implemented the first. A tripped gate skipped
      # `Commit and push`, and data/output/ -- ~15,000 Yahoo requests and 25
      # minutes of a runner's life -- died with the container. 2026-09-03 is
      # the case in point: Yahoo answered every batch, fundamentals came back
      # 400/400, and the night was thrown away over ONE duplicate row in
      # shortlist_log.csv. The only way back to that data was to ask Yahoo for
      # all of it again, six times, from a datacenter IP -- which is how a C
      # class bug (dup row, fixed in d6fec77e) turned into `HTTP 401 Invalid
      # Crumb` and two days of a stale dashboard.
      #
      # With the artifact, a failed gate costs a re-audit, not a re-fetch.
      # Retention is short on purpose: this is a repair buffer, not an archive.
      - name: Preserve fetched data when a gate failed
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: data-output-${{ github.run_id }}
          path: data/output/
          retention-days: 7
          if-no-files-found: warn

      # The ledger must survive the night it describes. Until now a run that
      # tripped ANY gate skipped `Commit and push`, so its run_ledger line --
      # the only record of what actually happened -- died with the runner.
      # Checking "how often does fundamentals hit the wall?" on 2026-08-28
      # returned `walled: true` ZERO times in the committed history, not
      # because it never happened but because the nights it happened are the
      # nights that never committed. A ledger blind to failures is a ledger
      # of successes.
      #
      # This is NOT the plan-B exception: plan B refuses to publish bad MARKET
      # DATA. The ledger is not market data, it is the record. Only the three
      # bookkeeping files are staged here, never data/output.
      # HOW it is recorded: discard and replay, never rebase. The failed run's
      # working tree is full of files the run produced -- untracked here, but
      # possibly TRACKED on main by then, because whichever run landed the
      # session first committed the same names (09-09: a dispatch had pushed
      # data/output/trades/SOXL_2026-09-08_000.json, and this run had its own
      # untracked copy). `rebase --autostash` only stashes tracked changes, so
      # all three attempts died on "untracked working tree files would be
      # overwritten ... could not detach HEAD", and the failure left no trace
      # on origin but a ::warning:: in a log that expires in 90 days. A second
      # trap sat behind the first: run_ledger.jsonl is append-only, so if main
      # appended a line while we ran, a rebase collides on the file's last
      # line (no .gitattributes, no union merge).
      #
      # So: take out exactly what this run added -- the ledger lines past the
      # checkout commit's line count (pipeline/run_ledger.py only ever opens
      # the file with "a"), plus any audit JSON this run changed -- park them
      # in $RUNNER_TEMP, reset hard onto origin/main, append/copy them back,
      # stage those three paths and nothing else. BASE_SHA is github.sha, the
      # commit actions/checkout checked out, NOT `git rev-parse HEAD`: if
      # `Commit and push` got as far as its commit and then lost the push
      # race, HEAD already contains tonight's line and would count it as old.
      # An audit JSON this run did not touch is NOT copied back -- that would
      # roll main's newer copy back to our checkout's.
      # Tested by pipeline/tests/test_failed_run_ledger_commit.py.
      - name: Commit the ledger even when a gate failed
        if: failure()
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LEDGER=data/history/run_ledger.jsonl
          AUDITS="data/history/audit_last.json data/history/audit_ledger_last.json"
          KEEP="${RUNNER_TEMP:-/tmp}/failed-run-ledger"
          rm -rf "$KEEP"; mkdir -p "$KEEP"
          BASE="${BASE_SHA:-}"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=$(git rev-parse HEAD)
          if git cat-file -e "$BASE:$LEDGER" 2>/dev/null; then
            N=$(git show "$BASE:$LEDGER" | wc -l)
          else
            N=0
          fi
          if [ -f "$LEDGER" ]; then tail -n +$((N + 1)) "$LEDGER" > "$KEEP/lines"; else : > "$KEEP/lines"; fi
          CHANGED=""
          for a in $AUDITS; do
            [ -f "$a" ] || continue
            if git cat-file -e "$BASE:$a" 2>/dev/null && git show "$BASE:$a" | cmp -s - "$a"; then
              continue
            fi
            cp "$a" "$KEEP/$(basename "$a")"
            CHANGED="$CHANGED $a"
          done
          echo "this run added $(wc -l < "$KEEP/lines" | tr -d ' ') ledger line(s) past $BASE ($N); changed audits:${CHANGED:- none}"
          if [ ! -s "$KEEP/lines" ] && [ -z "$CHANGED" ]; then
            echo "no ledger changes to record"; exit 0
          fi
          for i in 1 2 3; do
            if git fetch origin main && git reset --hard origin/main && git clean -fdq -- data/; then
              if [ -s "$KEEP/lines" ]; then
                mkdir -p "$(dirname "$LEDGER")"; touch "$LEDGER"
                # a line main already has (e.g. HEAD had been rebased onto it)
                # is not appended twice; every line carries its own timestamps
                if [ -s "$LEDGER" ] && [ -n "$(tail -c 1 "$LEDGER")" ]; then echo >> "$LEDGER"; fi
                grep -vxF -f "$LEDGER" "$KEEP/lines" >> "$LEDGER" || true
              fi
              for a in $CHANGED; do cp "$KEEP/$(basename "$a")" "$a"; done
              git add -- "$LEDGER" $CHANGED 2>/dev/null || true
              if git diff --staged --quiet; then
                echo "origin/main already carries this run's ledger lines — nothing to record"; exit 0
              fi
              git commit -q -m "chore(ledger): record the run that failed $(date +%Y-%m-%d)" \
                && git push origin HEAD:main && exit 0
            fi
            sleep 15
          done
          echo "::warning title=Ledger not recorded::the failed run's evidence could not be pushed"

      - name: Discord notification (success)
        if: success() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          SCREENER_COUNT=$(ls data/output/*.json 2>/dev/null | wc -l)
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\":\"Dashboard updated: $(date +%Y-%m-%d) — ${SCREENER_COUNT} files generated\"}" \
            "$DISCORD_WEBHOOK_URL"

      - name: Discord notification (failure)
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\":\"Dashboard update FAILED: $(date +%Y-%m-%d) — check Actions logs\"}" \
            "$DISCORD_WEBHOOK_URL"
