# The test suite finally has an automatic trigger.
#
# Until 2026-09-04 no workflow ran pytest. `audit_wiring` had been printing
# that fact as its own last line -- "the test suite itself has no automatic
# trigger" -- and nothing acted on it. What it cost, measured on that day:
#
#   * two tests in test_audit_wiring.py had been red for an unknown stretch,
#     and the red was a REAL hole: the auditor could not see a call written
#     as the compact `- run: |` step form, so a wired guard read as UNWIRED;
#   * the suite could not finish at all -- a wall-retry test and a shared
#     rate limiter, each correct alone, together slept the real 30/60/120s
#     backoff ladder;
#   * both were invisible because running the suite was a thing a human had
#     to remember to type.
#
# SEVERITY: loud, not blocking (DATA_RELIABILITY.md §二点五). This runs on its
# own trigger and never gates the nightly data pipeline. A red suite must be
# impossible to miss; it must not be able to stop the dashboard from updating.
#
# PyYAML is installed here ON PURPOSE and is absent from pipeline/requirements
# by design: `audit_wiring._run_blocks` has a YAML path and a regex fallback,
# and each environment exercises one of them. Local runs cover the fallback,
# CI covers the YAML branch. Removing it here would leave the YAML branch
# with no coverage anywhere -- which is exactly the state the compact-step
# hole survived in.
# TRIGGER NARROWING (T-0923-121, 2026-09-23): `push:` used to fire on any
# branch + any path. Andy's inbox took two spam waves in two days from it --
# 25 runs in one hour on 09-23 (agent branches pushing, and pure-content
# commits like `Fluxus_Brand/ops/material_inbox.md` / taskboard files / the
# vault-question and board-patrol skill migrations), plus a 43-minute red
# window (09-23 15:02-15:45 JST, 6b6676a9 -> 22eb7017) where every push in
# between mailed another failure.
#
# Fix: `push:` only fires on main (agent branches merge in via the taskboard
# gate/reviewer flow, not by pushing here -- see CLAUDE.md safe-merge rules),
# and `paths-ignore` skips commits that touch only directories `git grep`
# confirmed pipeline/tests and tests/ never read as data:
#   Fluxus_Brand/**, Fluxus_Substack/**, docs/**, .claude/**,
#   data/content/**, data/research/**.
# Each of those four has a real exception carved back in with `!` (order
# matters -- a later positive pattern re-includes what an earlier `!`
# excluded), because the naive "whole directory is docs" read from the task
# brief was wrong:
#   - Fluxus_Brand/ops/tools/x_watch/fetch.py is imported by
#     test_x_watch_fetch.py (its own docstring explains why: this file is
#     the only thing that runs it, since CI only used to cover pipeline/tests).
#   - data/content/x_watch/tools/**.py and scoring/mood_index.py are
#     imported the same way by the other test_x_watch_*.py files.
#   - data/research/claims/claims.jsonl is read live by
#     test_claim_registry.py::TestLiveRegistry.
# `data/reference/**` was proposed too but dropped entirely (not narrowed):
# schema_snapshot.json, screener_methods.md and METRIC_SOURCES.md are all
# read for real content by test_output_shape_guards.py / test_ep_screeners.py
# / test_audit_fix_0921.py / test_audit_metric_names.py, and it's already
# excluded from ALEX's own auto-merge whitelist (CLAUDE.md safe-merge) as
# too load-bearing to treat as inert docs. `**/*.md` (blanket, repo-wide)
# was dropped for the same reason -- this repo's test suite exists
# specifically to audit .md contract files as semi-code.
#
# Who notices a real red now that pushes don't self-report as fast: T-0922-61
# (alex-sentinel checks main's CI status every 2 hours, opens a P0 to alex on
# red) -- not "wait for the next person to push".
name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Fluxus_Brand/**'
      - '!Fluxus_Brand/ops/tools/x_watch/**'
      - 'Fluxus_Substack/**'
      - 'docs/**'
      - '.claude/**'
      - 'data/content/**'
      - '!data/content/x_watch/tools/**'
      - '!data/content/x_watch/scoring/**'
      - 'data/research/**'
      - '!data/research/claims/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
          pip install pytest PyYAML

      # Two test trees, one run. Until 2026-09-11 this line said only
      # `pipeline/tests`, so the root `tests/` tree (gex, book, centaur, flow,
      # options, profile, reference, plus the top-level test_*.py) had no
      # automatic trigger at all -- the same hole this file was created to
      # close, one directory over. tests/test_no_naive_clock.py sat red on
      # main for 14 days (fixed 2026-09-10) and nothing noticed.
      #
      # No extra install is needed for the root tree: its only non-stdlib
      # import beyond pandas/numpy is jinja2 (tests/gex -> pipeline/gex/render),
      # and jinja2 is already in pipeline/requirements.txt. pipeline/gex/ibkr
      # imports ib_async, but only lazily inside the live-pull branch, so no
      # root test needs an IBKR connection. Nothing is --ignore'd.
      #
      # Both trees contain a test_marketcal.py. That is harmless only because
      # pipeline/tests is a package and tests/ is not; if that ever changes,
      # pytest fails collection loudly rather than dropping one of them.
      #
      # --continue-on-collection-errors: the job still goes red on any
      # collection error (exit code stays non-zero), but the other ~2400 tests
      # still run and report. Without it, the first push of this change showed
      # exactly one thing -- three tests/gex modules failing to import on 3.11
      # (pipeline/gex/engine.py annotates `today: date` but stopped importing
      # `date` in c625b93e, 2026-07-23; Python 3.14's lazy annotations hide it
      # locally) -- and zero results for everything else. One broken import
      # must not blind the whole suite.
      - name: pytest
        run: |
          python -m pytest pipeline/tests tests -q -m "not slow" --tb=short --continue-on-collection-errors

      # Blocking. The rule: if a file's header says "谁读：X", then X's
      # contract must list that file under **reads**. Both halves are written
      # by hand and neither one fails when they disagree -- the lists just look
      # full. Found six real breaks on 2026-09-10; all fixed, so this is a
      # ratchet at zero, not an alarm. WORKTREE (not origin/main) because the
      # checkout is shallow and we want THIS commit's state.
      - name: audit_reads_declarations
        run: |
          python pipeline/tools/audit_reads_declarations.py --rev WORKTREE

      # Reported, never blocking: this one prints which guards nobody calls.
      # It is allowed to be red without failing the job, because its verdict
      # is a to-do list, not a defect in this commit.
      - name: audit_wiring (reported)
        if: always()
        continue-on-error: true
        run: |
          python -m pipeline.tools.audit_wiring
