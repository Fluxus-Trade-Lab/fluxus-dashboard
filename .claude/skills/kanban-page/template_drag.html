      --ink:#1A1D24; --sub:#586072; --mute:#8A91A2; --line:#DCE0E7;
      --amb:#9A6420; --ambbg:#FBF0DC; --ok:#2C7D57; --okbg:#E3F3EA; --hot:#B83F35; --hotbg:#FBE7E4;
      --blu:#2F5DA8; --blubg:#E5EDF9; --shadow:0 1px 0 rgba(20,30,50,.06),0 6px 16px -10px rgba(20,30,50,.25);
    }

  :root[data-theme="light"]{
    color-scheme:light;
    --board:#EEF0F3; --board2:#E4E8EE; --list:#F7F8FA; --card:#FFFFFF; --card-h:#FBFBFC;
    --ink:#1A1D24; --sub:#586072; --mute:#8A91A2; --line:#DCE0E7;
    --amb:#9A6420; --ambbg:#FBF0DC; --ok:#2C7D57; --okbg:#E3F3EA; --hot:#B83F35; --hotbg:#FBE7E4;
    --blu:#2F5DA8; --blubg:#E5EDF9; --shadow:0 1px 0 rgba(20,30,50,.06),0 6px 16px -10px rgba(20,30,50,.25);
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 500px at 15% -10%,var(--board2),transparent 60%),var(--board);
       color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100%}
  .wrap{padding-inline:16px;padding-block:26px 56px;max-width:1360px;margin:0 auto}
  .ic{width:15px;height:15px;stroke-width:2;flex:none}

  /* 顶部 */
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
  h1{font-size:clamp(19px,2.6vw,25px);font-weight:900;line-height:1.35;margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em;max-width:46ch}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 10px;border-radius:8px;background:var(--list);
        border:1px solid var(--line);color:var(--sub);white-space:nowrap}
  .chip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .chip.hot{background:var(--hotbg);border-color:transparent;color:var(--hot)} .chip.hot b{color:var(--hot)}
  .chip.ok{background:var(--okbg);border-color:transparent;color:var(--ok)} .chip.ok b{color:var(--ok)}
  .status{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}

  /* 看板 */
  .board{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
  .list{background:var(--list);border:1px solid var(--line);border-radius:12px;padding:10px;scroll-snap-align:start;min-width:0}
  .lh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 10px}
  .lh h2{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
  .lh .n{font-family:var(--mono);font-size:11.5px;color:var(--mute);background:var(--card);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
  .cards{display:flex;flex-direction:column;gap:8px}
  .card{background:var(--card);border-radius:10px;padding:10px 12px 11px;box-shadow:var(--shadow);cursor:pointer;
        border:1px solid transparent;text-align:left;width:100%;font:inherit;color:inherit;display:block;transition:background .12s,border-color .12s,transform .12s}
  .card:hover{background:var(--card-h);border-color:var(--line)}
  .card:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
  @media (prefers-reduced-motion:no-preference){.card:hover{transform:translateY(-1px)}}
  .labels{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
  .lb{font-size:11px;font-weight:600;padding:1px 8px;border-radius:5px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .lb.hot{background:var(--hotbg);color:var(--hot)} .lb.amb{background:var(--ambbg);color:var(--amb)}
  .lb.ok{background:var(--okbg);color:var(--ok)} .lb.blu{background:var(--blubg);color:var(--blu)}
  .ct{font-size:14px;font-weight:600;line-height:1.45;text-wrap:pretty}
  .cd{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.55}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;color:var(--mute);font-size:12px}
  .foot .meta{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:11px}
  .foot .meta span{display:inline-flex;align-items:center;gap:4px}
  .ask{display:inline-flex;margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--amb);background:var(--ambbg);border-radius:6px;padding:2px 8px}

         border:1px solid var(--line);border-radius:7px;padding:3px 9px;cursor:pointer}
  .reply:hover{border-color:var(--sub)}
  .reply[hidden]{display:none!important}
  .bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:9px}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:4px}

  .metric b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
  .metric.na{font-size:12px;color:var(--mute)}

  .ag .nm{font-family:var(--mono);color:var(--sub)}
  .ag .tr{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
  .ag .tr .d{background:var(--ok)} .ag .tr .b{background:var(--hot)}
  .ag .num{font-family:var(--mono);font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
  .legend{display:flex;gap:12px;font-size:11.5px;color:var(--mute);margin-top:8px}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
  .empty{font-size:12.5px;color:var(--mute);padding:8px 4px}

  /* 卡背 */
  dialog{border:1px solid var(--line);border-radius:14px;background:var(--list);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
  dialog::backdrop{background:rgba(5,7,12,.55)}
  .dh{display:flex;justify-content:space-between;gap:12px;padding:18px 20px 6px}
  .dh h3{margin:0;font-size:17px;line-height:1.4;text-wrap:balance}
  .x{background:none;border:0;color:var(--sub);cursor:pointer;padding:4px;border-radius:6px}
  .x:hover{color:var(--ink);background:var(--card)}

  .db .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase;margin-top:14px}

  a{color:var(--blu)}

  details.src{margin-top:26px;background:var(--list);border:1px solid var(--line);border-radius:12px}
  details.src summary{cursor:pointer;padding:12px 16px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--sub);list-style:none}

  details.src li{font-size:12.5px;color:var(--sub);margin:5px 0;line-height:1.6}
  footer{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:22px;line-height:1.9}

  .board.can-drag .card{cursor:grab}

  .sortable-chosen{box-shadow:0 14px 34px -12px rgba(0,0,0,.7)}
  .cards{min-height:44px}
  .lb.moved{background:var(--blubg);color:var(--blu)}
  .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;

  .toast button{font:inherit;font-size:12.5px;color:var(--blu);background:none;border:1px solid var(--line);border-radius:7px;padding:3px 10px;cursor:pointer}
  .toast[hidden]{display:none!important}
  @media (max-width:1100px){.board{grid-template-columns:repeat(4,minmax(272px,82vw))}}
</style>

  <div class="db" id="dlg-b"></div>
</dialog>

<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function icon(name){ var i=document.createElement('i'); i.setAttribute('data-lucide',name); i.className='ic'; return i; }
  var TONES={hot:1,amb:1,ok:1,blu:1};

  $('eyebrow').textContent = D.eyebrow;
  $('headline').textContent = D.headline;
  $('tag').textContent = D.tag;

  D.status.forEach(function(s){
    var c=el('span','chip'+(s.tone?' '+s.tone:'')); c.appendChild(icon(s.icon));
    c.appendChild(document.createTextNode(s.label+' ')); c.appendChild(el('b',null,s.value)); $('status').appendChild(c);
  });

  // 卡背
  var dlg=$('dlg');
  function openBack(title, parts){
    $('dlg-t').textContent=title; var b=$('dlg-b'); b.textContent='';
    parts.forEach(function(p){
      if(p.k){ b.appendChild(el('div','k',p.k)); }
      if(p.t){ b.appendChild(el('p',null,p.t)); }
      if(p.a){ var pa=el('p'); var a=el('a',null,p.a.text); a.href=p.a.href; a.target='_blank'; a.rel='noopener'; pa.appendChild(a); b.appendChild(pa); }
    });
    if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
    paintIcons();
  }
  $('dlg-x').addEventListener('click',function(){ dlg.close(); });
  dlg.addEventListener('click',function(e){ if(e.target===dlg) dlg.close(); });

  function card(onOpen){
    var c=el('div','card'); c.tabIndex=0; c.setAttribute('role','button');
    c.addEventListener('click',function(e){ if(e.target.closest('.reply')||e.target.closest('a')) return; onOpen(); });
    c.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ') && e.target===c){ e.preventDefault(); onOpen(); } });
    return c;
  }

  // 四列：卡在你手上 / 进行中 / 已完成（近 7 天）/ 排期·下一步——同一种卡片
  var lists=[], counts=[], cardsById={}, seq=0;
  D.columns.forEach(function(col, ci){
    var sec=el('section','list'); var hid='l'+(ci+1); sec.setAttribute('aria-labelledby',hid);
    var lh=el('div','lh'); var h=el('h2'); h.id=hid; h.appendChild(icon(col.icon)); h.appendChild(document.createTextNode(col.title));
    lh.appendChild(h); lh.appendChild(el('span','n',String(col.cards.length))); sec.appendChild(lh);
    var list=el('div','cards'); list.dataset.col=String(ci); sec.appendChild(list); lists[ci]=list; counts[ci]=lh.querySelector('.n');
    if(!col.cards.length){ list.appendChild(el('div','empty',col.empty||'')); }
    col.cards.forEach(function(t){
      var c=card(function(){
        var parts=[{t:t.desc}];
        if(t.ask) parts.push({k:'要你回的',t:t.ask});
        (t.back||[]).forEach(function(p){ parts.push(p); });
        if(t.ref) parts.push({k:'单号 / commit',t:t.ref});
        if(t.link) parts.push({a:t.link});
        openBack(t.title, parts);
      });
      if(t.labels && t.labels.length){
        var lb=el('div','labels');
        t.labels.forEach(function(l){ lb.appendChild(el('span','lb '+(TONES[l.tone]?l.tone:'blu'),l.t)); });
        c.appendChild(lb);
      }
      c.appendChild(el('div','ct',t.title));
      if(t.desc) c.appendChild(el('div','cd',t.desc));
      if(t.ask) c.appendChild(el('div','ask',t.ask));
      var f=el('div','foot'); var m=el('div','meta');
      if(t.ref){ var s=el('span'); s.appendChild(icon('hash')); s.appendChild(document.createTextNode(t.ref)); m.appendChild(s); }
      f.appendChild(m);
      if(t.link){ var a=el('a',null,t.link.text); a.href=t.link.href; a.target='_blank'; a.rel='noopener'; f.appendChild(a); }
      var r=el('button','reply'); r.type='button'; r.hidden=true; r.appendChild(icon('message-square')); r.appendChild(document.createTextNode('回话'));
      r.addEventListener('click',function(){ reply(c); }); f.appendChild(r); c.appendChild(f);
      c.dataset.id=t.id||''; c.dataset.home=String(ci); c.dataset.idx=String(seq++); cardsById[t.id]=c;
      list.appendChild(c);
    });
    $('board').appendChild(sec);
  });

  (D.later||[]).forEach(function(s){ $('later').appendChild(el('li',null,s)); });
  (D.week||[]).forEach(function(s){ $('week').appendChild(el('li',null,s)); });
  (D.rules||[]).forEach(function(s){ $('rules').appendChild(el('li',null,s)); });
  D.sources.forEach(function(s){ $('sources').appendChild(el('li',null,s)); });

  function paintIcons(){ try{ if(window.lucide) lucide.createIcons(); }catch(e){} }
  paintIcons();

  // 回话：打开评论框，锚在这张卡上（Andy 的回话＝这条评论，刷新班读评论当回执）
  var comments=null;
  function reply(cardEl){
    if(!comments) return;
    comments.openComposer({element:cardEl}).catch(function(e){
      if(e && (e.code==='unavailable'||e.code==='not_granted'||e.code==='capability_disabled'||e.code==='capability_removed')){
        [].forEach.call(document.querySelectorAll('.reply'),function(b){ b.hidden=true; });
      }
    });
  }
  if(window.claude && claude.use){
    claude.use('comments').then(function(c){
      if(!c) return; comments=c;
      [].forEach.call(document.querySelectorAll('.reply'),function(b){ b.hidden=false; });
    }).catch(function(){});
  }

  // ── 拖拽：只在 D.drag 为真、且页面数据库可用时开。拖动写进 db 的 moves/<卡片 id>，
  //    刷新班开工先读 moves 当 Andy 的回执（拖到「已完成」＝他说做完了），并入 JSON 后删掉那条。
  function recount(){ lists.forEach(function(l,i){
    var n=l.querySelectorAll('.card').length; if(counts[i]) counts[i].textContent=String(n);
    var e=l.querySelector('.empty'); if(e) e.hidden = n>0;
  }); }
  function stamp(iso){ try{ var d=new Date(iso); return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }catch(e){ return ''; } }
  function markMoved(c, mv){
    var lb=c.querySelector('.labels'); if(!lb){ lb=el('div','labels'); c.insertBefore(lb,c.firstChild); }
    var old=lb.querySelector('.lb.moved'); if(old) old.remove();
    if(mv){ var t=el('span','lb moved','你拖的 · '+stamp(mv.at)); lb.insertBefore(t,lb.firstChild); }
    else if(!lb.children.length) lb.remove();
  }
  function place(c, ci){ var l=lists[ci]; if(!l || c.parentNode===l) return;
    if(String(ci)===c.dataset.home){ var me=Number(c.dataset.idx), after=null;
      [].some.call(l.querySelectorAll('.card'),function(x){ if(x.dataset.home===c.dataset.home && Number(x.dataset.idx)>me){ after=x; return true; } return false; });
      l.insertBefore(c, after); } else { l.appendChild(c); } }
  var toast=$('toast'), toastT=$('toast-t'), undoFn=null, toastTimer=null;
  function showToast(msg, undo){ toastT.textContent=msg; undoFn=undo; toast.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toast.hidden=true; undoFn=null; },8000); }
  $('toast-u').addEventListener('click',function(){ var f=undoFn; toast.hidden=true; undoFn=null; if(f) f(); });

  if(D.drag && window.claude && claude.use){
    claude.use('db').then(function(db){
      if(!db || !window.Sortable) return;
      var moves=db.collection('moves'), applied={};
      moves.onSnapshot(function(snap){
        var seenNow={};
        snap.docs.forEach(function(d){
          var mv=d.data(); var c=cardsById[d.id]; if(!c||!mv) return; seenNow[d.id]=1;
          var to=Number(mv.to); if(lists[to]) place(c,to); markMoved(c,mv);
        });
        Object.keys(applied).forEach(function(id){ if(!seenNow[id]){ var c=cardsById[id]; if(c){ place(c,Number(c.dataset.home)); markMoved(c,null); } } });
        applied=seenNow; recount(); paintIcons();
      }, function(){});
      $('board').classList.add('can-drag');
      lists.forEach(function(l){
        Sortable.create(l,{group:'board', sort:false, animation:160, filter:'.reply, a, .empty', preventOnFilter:false,
          delay:180, delayOnTouchOnly:true, ghostClass:'sortable-ghost', chosenClass:'sortable-chosen',
          onEnd:function(ev){
            var from=Number(ev.from.dataset.col), to=Number(ev.to.dataset.col); if(from===to) return;
            var c=ev.item, id=c.dataset.id; if(!id) return;
            var home=Number(c.dataset.home), ref=moves.doc(id);
            var w = (to===home) ? ref.delete() : ref.set({to:to, to_title:D.columns[to].title, from:from, from_title:D.columns[from].title,
                                                          home:home, title:c.querySelector('.ct').textContent, at:new Date().toISOString()});
            recount();
            w.then(function(){
              showToast('已移到「'+D.columns[to].title+'」', function(){
                place(c,from); recount();
                (from===home ? ref.delete() : ref.set({to:from, to_title:D.columns[from].title, from:to, from_title:D.columns[to].title,
                  home:home, title:c.querySelector('.ct').textContent, at:new Date().toISOString()})).catch(function(){});
              });
            }).catch(function(){ place(c,from); recount(); showToast('没存上，已放回原处', null); $('toast-u').hidden=true; setTimeout(function(){ $('toast-u').hidden=false; },8000); });
          }});
      });
    }).catch(function(){});
  }
})();
</script>
