<!doctype html><meta charset=utf-8><title>watchlist · ATR 位 · v4（胜出稿，第 2 轮）</title>
<link rel=stylesheet href=_shared.css><div class=wrap>
<h1>watchlist · ATR 位 · v4（胜出稿，第 2 轮）</h1>
<p class=note>v2 的刻度轴 —— 位置就是读数 —— 加上 v3 的折底（线下方的票离开主视线）和 v1 的空心点（未测量有自己的形状，不是一段空白）。方块仍按 0–4 / 5–7 / ≥7 上现有语义色：位置和颜色是同一个量的两个通道，实测 ramp 相邻档只有 1.06–1.62:1，光靠颜色分不开。</p>
<h2>entries · liquid leader pullback</h2>
<div class=panel><div class=phead><b>ll_pullback</b><span>25 只 · 08-18</span></div>
<div class=rows id=r></div><div id=fold></div>
<div class=legend id=lg></div></div>
<script src=_rows.js></script><script>
const d=isDark(),R=document.getElementById('r'),F=document.getElementById('fold'),AX=56,PAD=8;
function axis(v){
  if(v==null)return `<i style="width:${AX}px;flex:none;display:inline-block;text-align:center" title="ATR 位未测量">`
    +`<i style="width:5px;height:5px;border:1px solid var(--color-text-secondary);border-radius:50%;display:inline-block;transform:translateY(-1px)"></i></i>`;
  const f=atrFill(v,d),neg=v<0,p=neg?0:Math.min(v,10)/10*(AX-PAD-6);
  return `<i style="width:${AX}px;flex:none;position:relative;height:9px;display:inline-block" title="${v.toFixed(1)} ATR${neg?' — 在 50 日线下方':''}">`
   +`<i style="position:absolute;left:${PAD}px;right:0;top:4px;height:1px;background:var(--color-line)"></i>`
   +`<i style="position:absolute;left:${PAD}px;top:1px;width:1px;height:7px;background:var(--color-text-secondary)"></i>`
   +(neg?`<i style="position:absolute;left:0;top:2.5px;width:5px;height:5px;border:1px solid var(--color-text-secondary);border-radius:1px"></i>`
        :`<i style="position:absolute;left:${PAD+p}px;top:2px;width:6px;height:6px;border-radius:1px;background:${f.bg}"></i>`)+`</i>`;
}
const draw=(x,dim)=>{const el=document.createElement('div');el.className='row';if(dim)el.style.opacity='.62';
 el.innerHTML=`<span class=tk style="color:var(--color-text-bold)">${x.t}</span>${axis(x.a)}<span class=rs>${x.rs}</span>`;return el};
ROWS.filter(x=>x.a==null||x.a>=0).forEach(x=>R.append(draw(x,false)));
const neg=ROWS.filter(x=>x.a!=null&&x.a<0);
if(neg.length){const h=document.createElement('div');
 h.style.cssText='padding:4px 10px;border-top:1px solid var(--color-line);font-size:10.5px;color:var(--color-text-secondary)';
 h.textContent=`50 日线下方 · ${neg.length} 只`;F.append(h);neg.forEach(x=>F.append(draw(x,true)))}
document.getElementById('lg').innerHTML=
 `<span>轴：50 日线 → 10 ATR</span>`
 +`<span><i style="width:6px;height:6px;border-radius:1px;background:${atrFill(2,d).bg}"></i>0–4 建仓</span>`
 +`<span><i style="width:6px;height:6px;border-radius:1px;background:${atrFill(6,d).bg}"></i>5–7 持有</span>`
 +`<span><i style="width:6px;height:6px;border-radius:1px;background:${atrFill(9,d).bg}"></i>≥7 只减</span>`
 +`<span><i style="width:5px;height:5px;border:1px solid var(--color-text-secondary);border-radius:50%"></i>未测量</span>`;
</script></div>
