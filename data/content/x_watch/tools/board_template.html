<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X 名单 Ticker 台账</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  /* 看板标准（.claude/skills/kanban-page/template.html）：深色为底，浅色为第二主题。颜色只在 token 里定义。
     token 块与模板逐字一致；本页只加了两个组件 token 都不新造：.lb.mut（中性标签）与 .wallb（墙后铜色块，用 --amb）。 */
  :root{
    color-scheme:dark;
    --board:#0D0F14; --board2:#121620; --list:#171B24; --card:#1F2430; --card-h:#252B39;
    --ink:#E8EAEF; --sub:#9AA0B0; --mute:#646B7D; --line:#2A3040;
    --amb:#E0A458; --ambbg:#33281A; --ok:#5BBF8F; --okbg:#173025; --hot:#E8766C; --hotbg:#371C1A;
    --blu:#7EA6E8; --blubg:#1B2638; --shadow:0 1px 0 rgba(0,0,0,.35),0 6px 18px -10px rgba(0,0,0,.6);
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Noto Sans SC',system-ui,-apple-system,'PingFang SC',sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      color-scheme:light;
      --board:#EEF0F3; --board2:#E4E8EE; --list:#F7F8FA; --card:#FFFFFF; --card-h:#FBFBFC;
      --ink:#1A1D24; --sub:#586072; --mute:#8A91A2; --line:#DCE0E7;
      --amb:#9A6420; --ambbg:#FBF0DC; --ok:#2C7D57; --okbg:#E3F3EA; --hot:#B83F35; --hotbg:#FBE7E4;
      --blu:#2F5DA8; --blubg:#E5EDF9; --shadow:0 1px 0 rgba(20,30,50,.06),0 6px 16px -10px rgba(20,30,50,.25);
    }
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --board:#EEF0F3; --board2:#E4E8EE; --list:#F7F8FA; --card:#FFFFFF; --card-h:#FBFBFC;
    --ink:#1A1D24; --sub:#586072; --mute:#8A91A2; --line:#DCE0E7;
    --amb:#9A6420; --ambbg:#FBF0DC; --ok:#2C7D57; --okbg:#E3F3EA; --hot:#B83F35; --hotbg:#FBE7E4;
    --blu:#2F5DA8; --blubg:#E5EDF9; --shadow:0 1px 0 rgba(20,30,50,.06),0 6px 16px -10px rgba(20,30,50,.25);
  }
  *{box-sizing:border-box}
  html,body{overflow-x:hidden}
  body{margin:0;background:radial-gradient(1200px 500px at 15% -10%,var(--board2),transparent 60%),var(--board);
       color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100%}
  .wrap{padding-inline:16px;padding-block:26px 56px;max-width:1360px;margin:0 auto}
  .ic{width:15px;height:15px;stroke-width:2;flex:none}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* 顶部 */
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
  h1{font-size:clamp(19px,2.6vw,25px);font-weight:900;line-height:1.35;margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em;max-width:46ch}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 10px;border-radius:8px;background:var(--list);
        border:1px solid var(--line);color:var(--sub);white-space:nowrap;font-family:inherit}
  .chip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .chip.hot{background:var(--hotbg);border-color:transparent;color:var(--hot)} .chip.hot b{color:var(--hot)}
  .chip.ok{background:var(--okbg);border-color:transparent;color:var(--ok)} .chip.ok b{color:var(--ok)}
  button.chip{cursor:pointer}
  button.chip:hover{border-color:var(--sub)}
  .status{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 14px}

  /* 工具条：搜索 / 视图 / 日期 / 筛选，全部长成 chip */
  .bar{position:sticky;top:0;z-index:20;background:var(--board);padding:10px 0;margin-bottom:12px;border-bottom:1px solid var(--line);
       display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:8px;background:var(--list);border:1px solid var(--line);color:var(--mute)}
  .search:focus-within{border-color:var(--blu)}
  .search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:500 13px/1.4 var(--mono);padding:7px 0;outline:none}
  .search input::placeholder{color:var(--mute);font-weight:400}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;background:var(--list);overflow-x:auto;overflow-y:hidden;max-width:100%;scrollbar-width:thin}
  .seg button{flex:none;font:500 12.5px var(--sans);padding:6px 10px;background:none;border:0;color:var(--sub);cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--board)}
  .tog[aria-pressed="true"]{background:var(--blubg);border-color:transparent;color:var(--blu)}
  select.chip{appearance:auto;color:var(--ink);max-width:100%}
  .count{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
  .hint{font:inherit;font-size:12px;color:var(--blu);background:none;border:0;cursor:pointer;padding:0;text-decoration:underline}

  /* 精选（原 curated 四块，收进折叠） */
  details.fold{margin:0 0 14px;background:var(--list);border:1px solid var(--line);border-radius:12px}
  details.fold>summary{cursor:pointer;padding:10px 14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--sub);list-style:none;display:flex;gap:8px;align-items:center}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold[open]>summary{border-bottom:1px solid var(--line)}
  .cur{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;padding:12px}
  .cur section{background:var(--card);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
  .cur h3{margin:0;font-size:13px;font-weight:700}
  .cur .sub{font-size:11.5px;color:var(--mute);margin:2px 0 6px;line-height:1.45}
  .ci{display:flex;gap:8px;align-items:baseline;width:100%;background:none;border:0;padding:4px 6px;margin:0 -6px;text-align:left;font:inherit;color:inherit;cursor:pointer;border-radius:6px;min-width:0}
  .ci:hover{background:var(--card-h)}
  .ci .s{font-family:var(--mono);font-weight:600;font-size:13px;white-space:nowrap}
  .ci .t{font-size:12px;color:var(--sub);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ci .w{font-family:var(--mono);font-size:11.5px;color:var(--mute);white-space:nowrap}

  /* 看板 */
  .board{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(260px,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
  .list{background:var(--list);border:1px solid var(--line);border-radius:12px;padding:10px;scroll-snap-align:start;min-width:0}
  .lh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 4px}
  .lh h2{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
  .lh .n{font-family:var(--mono);font-size:11.5px;color:var(--mute);background:var(--card);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
  .ld{font-size:11.5px;color:var(--mute);padding:0 4px 9px;line-height:1.45}
  .cards{display:flex;flex-direction:column;gap:8px}
  .card{background:var(--card);border-radius:10px;padding:10px 12px 11px;box-shadow:var(--shadow);cursor:pointer;
        border:1px solid transparent;text-align:left;width:100%;font:inherit;color:inherit;display:block;transition:background .12s,border-color .12s,transform .12s}
  .card:hover{background:var(--card-h);border-color:var(--line)}
  .card:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
  @media (prefers-reduced-motion:no-preference){.card:hover{transform:translateY(-1px)}}
  .labels{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
  .lb{font-size:11px;font-weight:600;padding:1px 8px;border-radius:5px;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .lb.hot{background:var(--hotbg);color:var(--hot)} .lb.amb{background:var(--ambbg);color:var(--amb)}
  .lb.ok{background:var(--okbg);color:var(--ok)} .lb.blu{background:var(--blubg);color:var(--blu)}
  .lb.mut{background:var(--board2);color:var(--sub)}
  .ct{font-size:14px;font-weight:600;line-height:1.45;text-wrap:pretty}
  .cd{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;color:var(--mute);font-size:12px}
  .foot .meta{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:11px;flex-wrap:wrap}
  .foot .meta span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .reply{font:inherit;font-size:12px;display:inline-flex;align-items:center;gap:5px;color:var(--ink);background:var(--board2);
         border:1px solid var(--line);border-radius:7px;padding:3px 9px;cursor:pointer}
  .reply:hover{border-color:var(--sub)}
  .reply[hidden]{display:none!important}
  [hidden]{display:none!important}
  .empty{font-size:12.5px;color:var(--mute);padding:8px 4px}
  .more{font:inherit;font-size:12px;color:var(--sub);background:none;border:1px dashed var(--line);border-radius:8px;padding:6px;cursor:pointer;width:100%}
  .more:hover{color:var(--ink);border-color:var(--sub)}

  /* 票卡：代码 + 当日人数 + 人数条 */
  .tk{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .sym{font-family:var(--mono);font-weight:600;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
  .sym .d{color:var(--mute);font-weight:400}
  .metric{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--sub);white-space:nowrap}
  .metric b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
  .up{color:var(--ok)} .dn{color:var(--hot)} .flat{color:var(--mute)}
  .spark{display:flex;align-items:flex-end;gap:2px;height:20px;margin-top:8px}
  .spark span{flex:1;max-width:9px;background:var(--mute);border-radius:2px 2px 0 0;min-height:3px;opacity:.75}
  .spark span.on{background:var(--ink);opacity:1}
  .spark span.z{background:var(--line);height:2px;min-height:2px;opacity:1}
  .spark.big{height:44px;gap:3px;margin:6px 0 2px}
  .spark.big span{max-width:14px}

  /* 卡背 */
  dialog{border:1px solid var(--line);border-radius:14px;background:var(--list);color:var(--ink);padding:0;width:min(760px,calc(100vw - 32px));
         max-height:88vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
  dialog::backdrop{background:rgba(5,7,12,.55)}
  .dh{display:flex;justify-content:space-between;gap:12px;padding:18px 20px 6px;position:sticky;top:0;background:var(--list);z-index:2}
  .dh h3{margin:0;font-size:17px;line-height:1.4;text-wrap:balance;font-family:var(--mono)}
  .dh .acts{display:flex;gap:6px;align-items:flex-start}
  .x{background:none;border:0;color:var(--sub);cursor:pointer;padding:4px;border-radius:6px}
  .x:hover{color:var(--ink);background:var(--card)}
  .db{padding:4px 20px 20px}
  .db p{margin:8px 0;font-size:13.5px;color:var(--sub);line-height:1.65}
  .db .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase;margin-top:16px}
  .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
  .kv div{background:var(--card);border-radius:8px;padding:7px 10px;min-width:0}
  .kv small{display:block;font-size:11px;color:var(--mute)}
  .kv b{font-family:var(--mono);font-size:14px;font-weight:600;overflow-wrap:anywhere}
  .kv b.na{color:var(--mute);font-weight:400;font-size:12.5px}
  .seq{font-family:var(--mono);font-size:11px;color:var(--mute);line-height:1.7;overflow-wrap:anywhere}
  .who{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-family:var(--mono);font-size:12.5px;color:var(--sub)}
  .who span{display:inline-flex;align-items:center;gap:2px}
  .star{background:none;border:0;padding:0 2px;margin:0;cursor:pointer;line-height:1;font-size:13px;color:var(--mute)}
  .star:hover,.star[aria-pressed="true"]{color:var(--amb)}
  .po{padding:10px 0;border-top:1px dashed var(--line)}
  .po:first-child{border-top:0}
  .ph{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
  .ph .h{color:var(--ink);font-weight:500}
  .pt{font-size:13px;color:var(--ink);margin-top:4px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}
  .wallb{background:var(--ambbg);border-left:3px solid var(--amb);border-radius:8px;padding:10px 12px;margin-top:8px}
  .wallb .ph,.wallb .ph .h{color:var(--amb)}
  .symchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .symchips button{font:600 11.5px var(--mono);padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .symchips button:hover{border-color:var(--sub)}
  .sw{display:flex;gap:6px;margin-top:8px}
  a{color:var(--blu)}

  details.src{margin-top:26px;background:var(--list);border:1px solid var(--line);border-radius:12px}
  details.src summary{cursor:pointer;padding:12px 16px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--sub);list-style:none}
  details.src summary::-webkit-details-marker{display:none}
  details.src[open] summary{border-bottom:1px solid var(--line)}
  details.src ul{margin:0;padding:10px 16px 14px 32px}
  details.src li{font-size:12.5px;color:var(--sub);margin:5px 0;line-height:1.6}
  footer{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:22px;line-height:1.9}

  @media (max-width:1100px){.board{grid-template-columns:repeat(var(--cols,4),minmax(272px,82vw))}}
  @media (max-width:720px){.bar{position:static}}
</style>

<!-- build_board.py 只替换这一块 JSON；页面其余部分不动。 -->
<script type="application/json" id="data">/*__DATA__*/null</script>

<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="headline"></h1>
    </div>
    <div class="tags"><span class="chip" id="tag"></span></div>
  </div>
  <div class="status" id="status"></div>

  <details class="fold" id="curbox">
    <summary><i data-lucide="star" class="ic"></i><span id="cursum">精选</span></summary>
    <div class="cur" id="curated"></div>
  </details>

  <div class="bar" id="bar">
    <label class="search"><i data-lucide="search" class="ic"></i>
      <input id="q" type="search" placeholder="搜 ticker 或 handle —— 例 INTC / ohiain" autocomplete="off" aria-label="搜 ticker 或 handle"></label>
    <div class="seg" id="views" role="group" aria-label="视图">
      <button type="button" data-v="t" aria-pressed="true">票</button>
      <button type="button" data-v="p" aria-pressed="false">人</button>
      <button type="button" data-v="w" aria-pressed="false">墙后</button>
    </div>
    <div class="seg" id="dates" role="group" aria-label="日期（ET）"></div>
    <button type="button" class="chip tog" id="cash" aria-pressed="true">只看 $ 标记</button>
    <button type="button" class="chip tog" id="idx" aria-pressed="false">含指数</button>
    <button type="button" class="chip tog" id="wallonly" aria-pressed="false">只看墙后碰过的</button>
    <button type="button" class="chip tog" id="solo" aria-pressed="false">含只有 1 人说过的</button>
    <select class="chip" id="sort" aria-label="列内排序">
      <option value="today">按当日人数</option>
      <option value="total">按总提及</option>
      <option value="views">按总曝光</option>
      <option value="sym">按代码</option>
      <option value="t5">按 T+5 相对基准</option>
      <option value="rs">按 RS 评级</option>
      <option value="d50">按距 50 日线</option>
      <option value="bask">按篮子数</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <div class="board" id="board"></div>

  <details class="src"><summary>口径与数字出处</summary><ul id="sources"></ul></details>
  <footer id="foot"></footer>
</div>

<dialog id="dlg" aria-labelledby="dlg-t">
  <div class="dh"><h3 id="dlg-t"></h3>
    <div class="acts">
      <button class="reply" id="dlg-r" type="button" hidden><i data-lucide="message-square" class="ic"></i>回话</button>
      <button class="x" id="dlg-x" type="button" aria-label="关闭"><i data-lucide="x" class="ic"></i></button>
    </div>
  </div>
  <div class="db" id="dlg-b"></div>
</dialog>

<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function icon(name){ var i=document.createElement('i'); i.setAttribute('data-lucide',name); i.className='ic'; return i; }
  function paintIcons(){ try{ if(window.lucide) lucide.createIcons(); }catch(e){} }
  function link(href, text){ var a=el('a',null,text); a.href=href; a.target='_blank'; a.rel='noopener'; return a; }
  /* 帖子正文是 X API 原样（带 &amp; 之类实体），textContent 渲染前还原这几个。 */
  var ENT={'&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&#39;':"'"};
  function dec(s){ return String(s==null?'':s).replace(/&(amp|lt|gt|quot|#39);/g,function(m){return ENT[m];}); }
  var nf=function(n){ n=n||0; return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(n); };
  var isNil=function(v){ return v===null||v===undefined; };

  var DATES=D.dates, LAST=DATES[DATES.length-1], BENCH=D.bench||'SPY';
  var FWD={long:1,watching:1,short:1}, DONE={recap:1,exited:1};
  var WALLTXT={}; (D.wall||[]).forEach(function(w){ WALLTXT[w.id]=w.text||''; });
  var BYSYM={}; D.tickers.forEach(function(t){ BYSYM[t.sym]=t; });
  var HL={}; (D.highlights||[]).forEach(function(h){ (HL[h.sym]=HL[h.sym]||[]).push(h); });
  var SPARK_N=10;

  /* 状态。日期默认＝最后一个 ET 日（看板＝「今天」）；「全部」仍在，等于原来的默认视图再加一列「更早」。 */
  var S={v:'t', q:'', date:LAST, cash:true, idx:false, wallonly:false, solo:false, sort:'today', shown:{}};

  /* ⭐ 关注名单：只活在这台浏览器的 localStorage（与旧版同一个键，旧收藏不丢）。读写都包 try。 */
  var STAR_KEY='xboard.stars.v1', STARS;
  try{ var a0=JSON.parse(localStorage.getItem(STAR_KEY)||'[]'); STARS=new Set(Array.isArray(a0)?a0.filter(function(x){return typeof x==='string';}):[]); }catch(e){ STARS=new Set(); }
  function saveStars(){ try{ localStorage.setItem(STAR_KEY, JSON.stringify(Array.from(STARS))); }catch(e){} }
  function starBtn(h){
    var b=el('button','star',STARS.has(h)?'★':'☆'); b.type='button'; b.setAttribute('aria-pressed',STARS.has(h));
    b.title=(STARS.has(h)?'取消关注 @':'关注 @')+h;
    b.addEventListener('click',function(e){ e.stopPropagation(); STARS.has(h)?STARS.delete(h):STARS.add(h); saveStars();
      b.textContent=STARS.has(h)?'★':'☆'; b.setAttribute('aria-pressed',STARS.has(h)); dirty=true; if(!dlg.open) refresh(); });
    return b;
  }

  /* ── 读数 ── */
  function asOf(){ return S.date==='all'?LAST:S.date; }
  function prevOf(d){ var i=DATES.indexOf(d); return i>0?DATES[i-1]:null; }

  /* ── 列：按「所选日」与它前几天的人数分。一只票只进一列。 ──

  /* ── 筛选：与旧版同一套规则。有搜索词且命中代码时，四个筛选一律让路（09-22 $XLK 空表那个 bug）。 ── */

    var A=asOf(), wallOnly = np(t,A)===0&&wallOn(t,A);

  }

      SEARCH_MODE='sym';
      if(!r.length&&q.length>=2){ r=base.filter(function(t){return textHit(t,q);}); SEARCH_MODE='text'; }
    }

    return r;
  }

  function wallBlock(b,w,full){
    var x=el('div','wallb'), ph=el('div','ph'); ph.appendChild(el('span','h','@jfsrev · 墙后 · '+(w.kind||'—'))); ph.appendChild(el('span',null,w.d));

    if(w.url) ph.appendChild(link(w.url,'原帖 ↗')); x.appendChild(ph);

    if(full&&w.tickers&&w.tickers.length>4){ x.appendChild(el('div','seq','全部 '+w.tickers.length+' 只 · 公开区当天人数：'+w.tickers.map(function(s,i){return '$'+s+' '+wallPub(w)[i];}).join(' · '))); }

  function pagedPosts(b,list,make,emptyTxt){

    draw();
  }
  function openTicker(t){
    if(!t) return;
    var A=asOf(), P=prevOf(A), n=np(t,A), o=np(t,P);
    var b=back('$'+t.sym+(t.idx?' · 指数':'')+(t.cash?'':' · 裸码'));
    kv(b,[[A.slice(5)+' 人数',String(n)],['对比前日 '+(P?P.slice(5):''),n-o>0?'+'+(n-o):n-o<0?String(n-o):'持平'],['总提及',String(t.tn)],['总曝光',nf(t.tv)],
          ['峰值日',t.peak?t.peak.slice(5):'无提及日',!t.peak],['T+1 vs '+BENCH,relTxt(t,1),relv(t,1)===null],['T+5 vs '+BENCH,relTxt(t,5),relv(t,5)===null],
          ['RS 评级',isNil(t.rs)?naTxt(t):String(Math.round(t.rs)),isNil(t.rs)],['距 50 日线',isNil(t.d50)?naTxt(t):(t.d50>0?'+':'')+(t.d50*100).toFixed(2)+'%',isNil(t.d50)],
          ['ETF 篮子',(t.bask||[]).length?t.bask.join(' / '):(t.idx?'不适用（ETF/指数）':'无读数'),!(t.bask||[]).length]]);
    if(HL[t.sym]){ k(b,'今日变动（'+LAST.slice(5)+'）'); HL[t.sym].forEach(function(h){ b.appendChild(el('p',null,h.k+'：'+h.why)); }); }
    k(b,'全 '+DATES.length+' 天人数'); b.appendChild(spark(t,A,true)); b.appendChild(el('div','seq',DATES.map(function(d){return d.slice(5)+' '+np(t,d);}).join('　')));
    var ss=stSorted(t); k(b,'全部立场（'+ss.length+'）'); var lb=el('div','labels'); if(!ss.length) lb.appendChild(el('span','lb mut','未标')); ss.forEach(function(x){ lb.appendChild(el('span','lb '+stTone(x[0]),x[0]+' '+x[1])); }); b.appendChild(lb);
    var who=whoOf(t); k(b,'谁在说'+(S.date==='all'?'（全部日期）':'（'+S.date.slice(5)+'）')+' · '+who.length+' 人'); whoRow(b,who);
    if(t.wall.length){ k(b,'@jfsrev 墙后 · '+t.wall.length+' 条（付费区原文）'); t.wall.slice().reverse().forEach(function(w){ wallBlock(b,w,false); }); }
    var dayOnly=S.date!=='all', all=t.m.slice().sort(function(a,c){ return a.d<c.d?1:a.d>c.d?-1:c.v-a.v; });
    var hd=el('div','k'); b.appendChild(hd); var sw=el('div','sw'); b.appendChild(sw); var box=el('div'); b.appendChild(box);
    function drawPosts(){
      var list=dayOnly?all.filter(function(m){return m.d===S.date;}):all;
      hd.textContent='公开区帖子 · '+(dayOnly?S.date.slice(5)+' ':'全部 ')+list.length+' 条'; sw.textContent='';
      if(S.date!=='all'){ var bt=el('button','chip tog',dayOnly?'看全部 '+all.length+' 条':'只看 '+S.date.slice(5)); bt.type='button'; bt.addEventListener('click',function(){ dayOnly=!dayOnly; drawPosts(); }); sw.appendChild(bt); }
      box.textContent=''; pagedPosts(box,list,function(m){return postRow(m);},'这一天没有公开区提及。');

  /* ── 口径（原「口径说明」，内容不删） ── */
  [
    '裸代码噪声很大（RS、EMA、WHAT 这类被当成过代码），所以默认只显示帖子原文里真的带 $ 的那些。没有删任何数据——关掉「只看 $ 标记」全都在。默认折叠只有 1 人说过的票，按「含只有 1 人说过的」全都在；「墙后独有」那列不受这条折叠影响。',
