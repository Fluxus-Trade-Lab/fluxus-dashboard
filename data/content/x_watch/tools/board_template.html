<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X 名单 Ticker 台账</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDEFF1; --surface:#FFFFFF; --surface2:#F5F7F8; --raise:#E4E8EA;
  --ink:#15191C; --ink2:#3A444A; --muted:#5F6A70; --faint:#8C979D;
  --rule:#D5DADD; --rule2:#E6EAEC;
  --brass:#B06A05; --brass-soft:#F5E7CE; --brass-line:#E0C48C;
  --fwd:#1264B4; --fwd-soft:#E2ECF7;
  --shadow:0 1px 2px rgba(21,25,28,.06),0 8px 24px -12px rgba(21,25,28,.18);
  --sans:"Archivo","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#101416; --surface:#171C1F; --surface2:#1D2327; --raise:#232A2E;
  --ink:#E4E9EB; --ink2:#C2CBCF; --muted:#8B979D; --faint:#6C777D;
  --rule:#283035; --rule2:#212930;
  --brass:#D4972B; --brass-soft:#33280F; --brass-line:#5A4517;
  --fwd:#4290D2; --fwd-soft:#152836;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ground:#101416; --surface:#171C1F; --surface2:#1D2327; --raise:#232A2E;
  --ink:#E4E9EB; --ink2:#C2CBCF; --muted:#8B979D; --faint:#6C777D;
  --rule:#283035; --rule2:#212930;
  --brass:#D4972B; --brass-soft:#33280F; --brass-line:#5A4517;
  --fwd:#4290D2; --fwd-soft:#152836;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
/* ⚠️ 底部留白只有 14px，是**算出来的**，不是手感（09-23）。
   表格盒现在是 .wrap 的最后一个子元素，sticky 的行程上限＝它自己的下边缘，
   也就是说它**没有行程可走**（实测：滚到底时 box.bottom 恰好等于 .wrap 的内容框底）。
   于是页面能多滚的那点距离全部由 padding-bottom 提供，而多滚多少，表头就往
   工具条底下钻多少（72px 时实测表头顶 104 < 工具条底 134，列名被盖住）。
   不让它钻的充要条件：maxScrollY ≤ boxDocTop − stickyTop，代入
   boxH = 100vh − barh − 24 与 stickyTop = barh + 8，两边的 barh 与 vh 全约掉，
   只剩 **padding-bottom ≤ 16px**。取 14px，留 2px 余量。
   改这个数之前先把上面这条不等式重算一遍。 */
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 14px}
h1{font-size:21px;font-weight:700;letter-spacing:-.015em;margin:0;text-wrap:balance}
a{color:var(--brass)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── 顶栏 ── */
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;
  padding-bottom:12px;border-bottom:2px solid var(--ink);margin-bottom:14px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);flex-basis:100%}
.meta{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);
  font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:600}

/* ── 顶部 curated（替代原来那排占满一屏的重点卡） ── */
.curated{display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));
  gap:10px;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:2px;
  padding:10px 12px 11px;min-width:0}
.card h2{font:600 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:0 0 2px}
.card .sub{font-size:10.5px;color:var(--faint);line-height:1.35;margin:0 0 7px;
  overflow-wrap:anywhere}
.card ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.ci{display:flex;gap:8px;align-items:baseline;width:100%;background:none;border:0;
  padding:4px 5px;margin:0 -5px;text-align:left;font:inherit;color:inherit;cursor:pointer;
  border-radius:2px;min-width:0}
.ci:hover{background:var(--surface2)}
.ci .s{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:-.01em;
  white-space:nowrap}
.ci .w{font-size:11px;color:var(--muted);line-height:1.35;margin-left:auto;text-align:right;
  white-space:nowrap}
.ci .txt{font-size:11px;color:var(--muted);line-height:1.35;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.card .none{font-size:11.5px;color:var(--faint);line-height:1.45;overflow-wrap:anywhere;margin:0}
.ciw{display:flex;align-items:baseline;gap:4px;min-width:0}
.ciw .ci{flex:1;min-width:0}
.ext{font-size:11px;text-decoration:none;flex:none}

/* ── 折叠块（今日变动 / 人员名单） ── */
.fold{background:var(--surface);border:1px solid var(--rule);border-radius:2px;
  margin:0 0 14px;padding:0 12px}
.fold>summary{cursor:pointer;font:600 11px var(--sans);letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);padding:9px 0;list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▸ ";color:var(--faint)}
.fold[open]>summary::before{content:"▾ "}
.fold>summary:hover{color:var(--ink)}
.foldbody{padding:0 0 12px}
/* 口径说明与人员名单并排一行，收起时只占一条 —— 它们从表格下方挪到了上方
   （见下面 .tblbox 那段的说明），并排是为了别把表格又往下推一整行。 */
.foldrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.foldrow>.fold{margin:0;min-width:0}
@media (max-width:720px){.foldrow{grid-template-columns:1fr}}

/* ── 重点卡（收进折叠块） ── */
.flags{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:8px}
.flag{background:var(--surface2);border:1px solid var(--rule);border-radius:2px;
  padding:9px 11px 10px;display:flex;flex-direction:column;gap:3px;
  border-left:3px solid var(--rule);cursor:pointer;text-align:left;font:inherit;color:inherit;
  min-width:0}
.flag:hover{background:var(--raise)}
.flag.wall{border-left-color:var(--brass)}
.flag.fresh{border-left-color:var(--fwd)}
.flag-k{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.flag.wall .flag-k{color:var(--brass)} .flag.fresh .flag-k{color:var(--fwd)}
.flag-s{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.01em}
.flag-w{font-size:11.5px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}

/* ── 人员名单 ── */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(182px,1fr));gap:4px 10px}
.rp{display:flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:11.5px;
  color:var(--ink2);min-width:0}
.rp .n{color:var(--faint);margin-left:auto;white-space:nowrap}
.rp .h{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── ⭐ 关注钮 ── */
.star{background:none;border:0;padding:0 2px;margin:0;cursor:pointer;line-height:1;
  font-size:12px;color:var(--faint);vertical-align:baseline}
.star:hover{color:var(--brass)}
.star[aria-pressed="true"]{color:var(--brass)}

/* ── 工具条 ── */
.bar{position:sticky;top:0;z-index:20;background:var(--ground);
  padding:8px 0 9px;margin-bottom:2px;border-bottom:1px solid var(--rule);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 210px;min-width:150px;position:relative}
.search input{width:100%;padding:7px 10px 7px 27px;font:500 13px/1.4 var(--mono);
  background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:2px}
.search input::placeholder{color:var(--faint);font-weight:400}
.search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;stroke:var(--faint);fill:none;stroke-width:1.8}
/* ⚠️ 这里不能用 overflow:hidden —— 375px 下日期钮有 20 个，hidden 会把 09-12
   之后的直接裁掉，点都点不到（main 同病）。改成自己横滚。 */
.seg{display:flex;border:1px solid var(--rule);border-radius:2px;background:var(--surface);
  overflow-x:auto;overflow-y:hidden;max-width:100%;scrollbar-width:thin}
.seg button{flex:none}
.seg button{font:500 12px var(--sans);padding:7px 11px;background:none;border:0;
  color:var(--muted);cursor:pointer;border-right:1px solid var(--rule2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.chip{font:500 11.5px var(--mono);padding:6px 9px;border:1px solid var(--rule);
  border-radius:2px;background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:var(--brass-soft)}
select{font:500 12px var(--sans);padding:7px 8px;background:var(--surface);
  color:var(--ink);border:1px solid var(--rule);border-radius:2px;max-width:100%}

/* ── 表 ── */
/* ⚠️ 表头吸顶的坑：.scroll 只写 overflow-x:auto 时，overflow-y 的 visible 会被
   计算成 auto —— 它就成了纵向滚动容器，而它自己没有纵向溢出，于是 thead 的
   position:sticky 永远贴在一个不滚的盒子上，页面一滚列名就没了（main 同病，
   那边还硬编码 top:44px 去躲工具条，而 .bar 实测 133px 高，反把第一行压住）。
   修法：让 .scroll 真的接管纵向滚动，高度跟着视口减去工具条实高（--barh 由
   ResizeObserver 现场量），thead 贴 top:0 —— 不再有任何写死的 px。
   ⚠️ 光给 max-height 不够：盒顶恒在 curated + 今日变动 + 工具条之下（实测 y=519），
   一个 100vh−barh−26 高的盒子从那儿往下画，盒底永远掉出视口 359px，而且每个视口
   高度都一样多 —— 780px 的屏（MBP 14"）一屏只读得到 6 行，600px 只剩 1 行。
   所以盒子自己也要 sticky：页面一滚它就贴在工具条下沿，整只盒子回到视口里。
   ⚠️ 也不能 overscroll-behavior:contain —— 那会让鼠标停在表上时页面完全不滚，
   掉出去的那截够都够不着。默认的滚动链接（表滚到底 → 继续滚页面）就是对的。 */
/* ⚠️ T-0923-136：sticky 从 .scroll 挪到外壳 .tblbox —— 渐隐提示要 position:absolute
   叠在滚动盒之上，而 absolute 元素放进 overflow:auto 的盒子里会跟着内容一起横滚。
   壳负责 sticky（原来的行为一字不变：页面一滚整只盒回到工具条下沿），盒负责滚动。
   max-height 从 −26px 改成 −40px，是把顶部那条 14px 的同步滚动条让出来 ——
   盒底在视口里的落点（100vh−18px）与改动前完全一致。 */
.tblbox{position:sticky;top:calc(var(--barh, 140px) + 8px);z-index:1}
.scroll{overflow:auto;max-height:calc(100vh - var(--barh, 140px) - 40px);
  background:var(--surface);border:1px solid var(--rule);border-radius:0 0 2px 2px}

/* ── 横滚条常驻 + 顶部同步条 ──
   Andy 09-23：「目前我只能看到这里 / 所以需要一个左右的scroll 更方便的」。
   表能滚，但 macOS 的 overlay 滚动条平时隐藏、且只长在盒底（盒高近一屏，
   他看着表头时那条在 700px 以外）。两件事一起治：
   ① scrollbar-width / ::-webkit-scrollbar 两套都写 —— 只要写了 ::-webkit-scrollbar，
      Chromium 就把 overlay 条换成常驻的经典条，不滚动时截图里也看得见。
   ② 表头正上方再放一条同样宽的空条，拖它等于拖表。
   ⚠️ 这两套 CSS **不能写在同一个元素上**（09-23 实测，Chromium 145 / macOS）：
   只写 ::-webkit-scrollbar 时，macOS Chrome 把 overlay 条换成常驻经典条，
   `offsetHeight − clientHeight` = 13px（条）+ 2px（边框）= 15，截图里看得见；
   一旦同一元素上再写 scrollbar-width / scrollbar-color，**标准属性接管、webkit 伪元素失效**，
   读数立刻掉回 0（又变回平时不画的 overlay 条）。所以 .scroll 只留 webkit 那套。
   ⚠️ 量这件事的时候注意 headless 的 `--hide-scrollbars`（Playwright 默认带）：
   带上它六种写法一律读 0，会让人得出「macOS 上都不生效」的错误结论 —— 本轮我先栽了一次，
   复核在真页面量出 15px 才纠回来。跑之前确认参数里没有它。
   顶部那条则相反：.xtop 的原生条要藏掉（scrollbar-width:none + height:0），
   因为它上面盖着我们自己画的把手 .xbar/.xthumb，留着原生条就成了两条叠在 16px 里。
   于是表头上下各一条：上面是自绘把手（任何平台都画得出来），下面是常驻的经典条。 */
.xtop{overflow-x:auto;overflow-y:hidden;height:16px;
  background:var(--surface2);border:1px solid var(--rule);border-bottom:0;
  border-radius:2px 2px 0 0}
.xtop>div{height:1px}
.xbar{position:absolute;top:0;left:0;right:0;height:16px;z-index:15;background:none}
.xbar.off{display:none}
.xthumb{position:absolute;top:3px;bottom:3px;left:0;min-width:32px;
  background:var(--muted);border-radius:5px;cursor:grab}
.xbar:hover .xthumb{background:var(--ink2)}
.xthumb.drag{cursor:grabbing;background:var(--ink)}
.seg{scrollbar-width:thin;scrollbar-color:var(--muted) var(--surface2)}
.xtop{scrollbar-width:none}
.xtop::-webkit-scrollbar{height:0;width:0}
.scroll::-webkit-scrollbar{height:13px;width:13px;background:var(--surface2)}
.scroll::-webkit-scrollbar-track{background:var(--surface2)}
.scroll::-webkit-scrollbar-thumb{background:var(--muted);border-radius:7px;
  border:3px solid var(--surface2)}
.scroll::-webkit-scrollbar-thumb:hover{background:var(--ink2)}
.scroll::-webkit-scrollbar-corner{background:var(--surface2)}

/* 边缘渐隐：只是「那边还有列」的提示，永不吃点击（pointer-events:none）。
   左侧那道从首列右缘开始画 —— 首列是 sticky 的，永远在，压它没意义。
   --c1w 由 updateFades() 现场量首列实宽写入。 */
.fade{position:absolute;top:16px;bottom:15px;width:30px;pointer-events:none;
  z-index:14;opacity:0;transition:opacity .12s}
.fade.on{opacity:1}
.fade.fr{right:1px;background:linear-gradient(to right,rgba(0,0,0,0),var(--surface))}
.fade.fl{left:var(--c1w, 1px);background:linear-gradient(to left,rgba(0,0,0,0),var(--surface))}

/* 列开关（治本：关掉几列表就窄了，可能根本不用横滚） */
.colmenu{position:relative}
.colmenu>summary{font:500 12px var(--sans);padding:7px 10px;border:1px solid var(--rule);
  border-radius:2px;background:var(--surface);color:var(--muted);cursor:pointer;
  list-style:none;white-space:nowrap}
.colmenu>summary::-webkit-details-marker{display:none}
.colmenu>summary::after{content:" ▾";color:var(--faint)}
.colmenu[open]>summary{border-color:var(--brass);color:var(--brass)}
.colpop{position:absolute;top:calc(100% + 4px);right:0;z-index:30;min-width:186px;
  background:var(--surface);border:1px solid var(--rule);border-radius:2px;
  box-shadow:var(--shadow);padding:7px 4px 5px;max-height:62vh;overflow:auto}
.colopt{display:flex;align-items:center;gap:7px;font:500 12px var(--sans);
  color:var(--ink2);padding:4px 8px;border-radius:2px;cursor:pointer;white-space:nowrap}
.colopt:hover{background:var(--surface2)}
.colopt input{margin:0;accent-color:var(--brass)}
.colopt input:disabled{opacity:.55}
.colopt input:disabled+span{color:var(--faint)}
.colact{display:flex;gap:6px;padding:6px 8px 1px;margin-top:4px;border-top:1px solid var(--rule2)}
.colact button{flex:1;font:500 11px var(--sans);padding:5px 6px;border:1px solid var(--rule);
  border-radius:2px;background:var(--surface2);color:var(--muted);cursor:pointer;white-space:nowrap}
.colact button:hover{color:var(--ink);border-color:var(--ink2)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.wide{min-width:1180px}
thead th{position:sticky;top:0;z-index:10;background:var(--surface2);
  font:600 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);text-align:left;padding:0;white-space:nowrap;
  border-bottom:1px solid var(--rule)}
/* 首列同时 sticky 行列：表头 > 首列 > 内容 */
thead th:first-child{left:0;z-index:12;border-right:1px solid var(--rule)}
tbody td:first-child{position:sticky;left:0;z-index:5;background:var(--surface);
  border-right:1px solid var(--rule)}
tbody tr.row:hover td:first-child,tbody tr.row.open td:first-child{background:var(--surface2)}
tr.detail td:first-child{position:static;border-right:0}
th button.sortbtn{display:block;width:100%;background:none;border:0;cursor:pointer;
  font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;
  text-align:inherit;padding:8px 10px;white-space:nowrap}
th button.sortbtn:hover{color:var(--ink)}
th[aria-sort]:not([aria-sort="none"]) button.sortbtn{color:var(--ink)}
th.num button.sortbtn{text-align:right}
.dir{font-size:9px;vertical-align:1px;color:var(--brass)}
tbody td{padding:8px 10px;border-bottom:1px solid var(--rule2);vertical-align:middle}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--surface2)}
tbody tr.row.open td{background:var(--surface2)}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.sym{font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:-.01em;white-space:nowrap}
.sym .cur{color:var(--faint);font-weight:400}
.tagi{font:500 9.5px var(--mono);color:var(--faint);border:1px solid var(--rule);
  padding:0 3px;border-radius:2px;margin-left:5px;vertical-align:1px}
.who{color:var(--muted);font-size:11.5px;max-width:190px;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who.mono{max-width:230px}

/* 墙后徽标 —— 全页只有它和「前瞻」用颜色 */
.wallmark{display:inline-flex;align-items:center;gap:4px;font:600 10.5px var(--mono);
  color:var(--brass);background:var(--brass-soft);border:1px solid var(--brass-line);
  border-radius:2px;padding:1px 5px;white-space:nowrap}
.wallmark::before{content:"";width:5px;height:5px;background:var(--brass);border-radius:50%}

/* 立场:颜色只编「跑没跑」,词本身照写。
   ⚠️ 表里只显人数最高的 2 个 + 「+N」,一行放平不换行 —— 平均 4.3 个 chip 竖排
   才是行高的真正驱动,Andy 那句「占的空间太大」指的就是这个。全部立场在展开处。 */
.st{display:inline-flex;gap:3px;flex-wrap:nowrap;white-space:nowrap;align-items:baseline}
.st i.more{color:var(--faint);border:0;padding:0 1px}
.bask{display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st i{font:600 10.5px var(--mono);font-style:normal;padding:1px 5px;border-radius:2px;white-space:nowrap}
.st i.f{color:var(--fwd);background:var(--fwd-soft);border:1px solid var(--fwd)}
.st i.d{color:var(--ink2);background:var(--raise);border:1px solid var(--rule)}
.st i.n{color:var(--faint);border:1px solid var(--rule)}

/* 人数条 —— 单序列,量的是当日提及人数。默认只画近 10 天,全序列在悬停与展开处。
   ⚠️ 条色不能用 --rule：那是分隔线的灰，实测对深浅两版的行底色只有 1.38:1 / 1.22:1,
   3px 宽压下去除最后一天那根就肉眼不可见了。条色走 --muted(正文级)、宽度 5px,
   10 根 59px 仍比 main 的 19 根 169px 省掉三分之二。零值那根保持 --rule2 的细线,
   它要的就是「这天没人说」的留白,不参与可读性判据。 */
.spark{display:flex;align-items:flex-end;gap:1px;height:18px}
.spark span{width:5px;background:var(--muted);border-radius:1px 1px 0 0;min-height:3px}
.spark span.last{background:var(--ink)}
.spark span.zero{background:var(--rule2);height:2px;min-height:2px}
.delta{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.delta.up::before{content:"▲ ";font-size:8px;vertical-align:1px}
.delta.dn::before{content:"▼ ";font-size:8px;vertical-align:1px}
.delta.flat{color:var(--faint)}
.rel{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rel.na{color:var(--faint);font-size:11px}
/* 不适用（ETF/指数不在个股 universe 内）与「个股但当日无读数」视觉上分开 */
.na-idx{color:var(--faint);font-family:var(--mono);font-size:12px;cursor:help}
.na-eq{color:var(--ink2);font-family:var(--mono);font-size:14px;font-weight:600;cursor:help}

/* 展开的帖 */
tr.detail td{padding:0;background:var(--surface2);border-bottom:1px solid var(--rule)}
.posts{display:flex;flex-direction:column}
.full{padding:8px 14px;border-bottom:1px dashed var(--rule);font-size:11.5px;
  color:var(--muted);line-height:1.6;overflow-wrap:anywhere}
.full b{color:var(--ink2);font-weight:600}
.full .seq{font-family:var(--mono);font-size:11px}
.post{display:grid;grid-template-columns:82px 132px 1fr auto;gap:12px;align-items:baseline;
  padding:8px 14px;border-top:1px dashed var(--rule)}
.post:first-child{border-top:0}
.post .d{font-family:var(--mono);font-size:11px;color:var(--faint)}
.post .h{font-family:var(--mono);font-size:11.5px;color:var(--ink2);font-weight:500;
  overflow:hidden;text-overflow:ellipsis}
.post .t{font-size:12.5px;color:var(--ink2);line-height:1.5;overflow-wrap:anywhere}
.post .t a{text-decoration:none;border-bottom:1px solid var(--brass-line)}
.post .v{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
.post.wallp{background:var(--brass-soft);border-left:3px solid var(--brass)}
/* 墙后正文（09-24 起直接上页）。正文列在表里只给一行，点开才铺全文 ——
   Jeff 的帖中位 260 字，整段铺进单元格会把行高顶成四五行，表就没法扫了。 */
/* ⚠️ max-width 写在 <td> 上不生效（table-layout 是 auto，td 会被内容撑开，
   整张表跟着被顶到一千多 px 宽，正文列反而滚到屏幕外——09-24 第一版就是这么栽的）。
   必须套一层 display:block 的 span，宽度才收得住。 */
.wprev{display:block;width:420px;max-width:420px;font-size:11.5px;color:var(--ink2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ⚠️ 同一个「max-width 在 td 上不生效」的坑，墙后视图里还有两格：
   一条 Groups 帖挂 46 只票、46 个当日人数，把表顶到 4462px 宽（视口 1138），
   正文列被推到 x=2613 —— 页面上根本看不到。两格都套 block span 收住，
   全量放进展开行（挂 5 只票以上才印）。 */
.wclip{display:block;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wclip.pub{max-width:150px}
.wbody{margin-top:4px;font-size:12.5px;line-height:1.6;color:var(--ink2);
  white-space:normal;overflow-wrap:anywhere}
tr.detail .full.wbody{padding:10px 14px;border-bottom:0;color:var(--ink2)}

.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}
/* ⚠️ 遮挡这件事的账（09-23，Andy：「最下方有问题」）——
   .tblbox 是 sticky 的，它的包含块是 .wrap，一直延伸到脚注和人员名单之下，
   滚到页底时盒子会压在它们上面（实测 #note 被盖 175px、手机 397px，名单点不开）。
   上一轮的修法是给 #note/#rosterbox 加 position:relative;z-index:2 把它们抬到盒子之上
   —— 点是点得开了，但**变成它们反过来盖住表格行**：整段口径说明压在 $PANW/$HPE 上，
   名单那条夹在 $HPE 和 $CRDO 中间。两个东西抢同一块屏幕，谁盖谁都难看。
   现在的修法是结构上不再重叠：**把这两块挪到表格之前**（工具条上方，和「今日变动」
   同一组折叠块）。sticky 盒后面再没有兄弟节点，遮挡从根上消失，
   那两条 z-index/background 补丁一并删掉 —— 不用 z-index 互相盖。 */
.note{font-size:11.5px;color:var(--muted);margin:0 2px 2px;line-height:1.6}
.note code{font-family:var(--mono);font-size:11px;background:var(--raise);padding:1px 4px;border-radius:2px}
.count{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:0 2px}
@media (max-width:720px){
  .wrap{padding:16px 12px 14px}   /* 底部同上：必须 ≤16px，见 .wrap 那条注释 */
  .post{grid-template-columns:1fr;gap:3px}
  .who{max-width:150px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
const D = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const nf = n => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n||0);
/* 墙后正文：Andy 2026-09-24 取消「只存不引」——「我要在ticker台账上直接能看到」。
   正文只在 D.wall 里存一份，按 post id 查；票视图那边只带 id，不复制正文。 */
const WALLTXT = new Map((D.wall||[]).map(w => [w.id, w.text || ""]));
const wtxt = w => (w && (w.txt || WALLTXT.get(w.id))) || "";
const lines = s => esc(s).replace(/\n/g, "<br>");
const FWD = new Set(["long","watching","short"]), DONE = new Set(["recap","exited"]);
const DATES = D.dates, LAST = DATES[DATES.length-1], PREV = DATES[DATES.length-2] || null;
const SPARK_N = 10;                       // 默认只画近 10 天；全序列在悬停与展开处
const SPARK_DATES = DATES.slice(-SPARK_N);

/* 三个视图各自记住自己的排序列与方向。dir: 1 升序 / -1 降序。 */
const S = { v:"t", q:"", date:"all", cash:true, idx:false, wallonly:false, solo:false, openw:new Set(),
            sort:"today", open:new Set(),
            ord:{ t:{k:"today",dir:-1}, p:{k:"posts",dir:-1}, w:{k:"d",dir:-1} } };

/* ── ⭐ 关注名单：只活在这台浏览器的 localStorage 里。
   隐私窗口 / 清过站点数据 / 被策略禁用时，读写都会抛 —— 每一次都包 try，
   取不到就当空集合，页面照常渲染。 ── */
const STAR_KEY = "xboard.stars.v1";
function loadStars(){
  try{
    const raw = window.localStorage.getItem(STAR_KEY);
    const a = JSON.parse(raw || "[]");
    return new Set(Array.isArray(a) ? a.filter(x => typeof x === "string") : []);
  }catch(e){ return new Set(); }
}
function saveStars(){
  try{ window.localStorage.setItem(STAR_KEY, JSON.stringify([...STARS])); }
  catch(e){ /* 存不下就只在本次会话里有效，不影响渲染 */ }
}
let STARS = loadStars();
const starBtn = h => `<button class="star" data-h="${esc(h)}" aria-pressed="${STARS.has(h)}"` +
  ` title="${STARS.has(h) ? "取消关注 @" : "关注 @"}${esc(h)}">${STARS.has(h) ? "★" : "☆"}</button>`;

/* 相对表现单元格：[值, 原因]。没有值时照写原因，不写 0、不留空——
   「无价格」和「0%」是两件完全不同的事。 */
const relv = (t,k) => (t.rel && t.rel[k]) ? t.rel[k][0] : null;
const relCell = (t,k) => {
  const c = t.rel && t.rel[k];
  if (!c) return `<span class="rel na">—</span>`;
  if (c[0] === null) return `<span class="rel na">${esc(c[1])}</span>`;
  return `<span class="rel ${c[0]>0?"up":c[0]<0?"dn":""}">${c[0]>0?"+":""}${c[0].toFixed(2)}%</span>`;
};

/* 结构三列（RS 评级 · 距 50 日线% · ETF 篮子）：读 data/output 的现成字段。
   空格子分两种，视觉上要能区分 ——
     ETF/指数（t.idx）：这三列的源（universe.json / groups.json 的 etf 篮子）本来就
       只收个股，它们不是缺数据，是 **不适用** → 淡色「—」。
     个股：源里该有而没有 → 「·」，那才是真的当日没读数。 */
const naCell = t => t.idx
  ? `<span class="na-idx" title="ETF/指数，不在个股 universe 内">—</span>`
  : `<span class="na-eq" title="个股但当日无读数">·</span>`;
const isNil = v => v === null || v === undefined;
const rsCell = t => isNil(t.rs) ? naCell(t)
  : `<span class="rel${t.rs >= 80 ? " up" : ""}">${Math.round(t.rs)}</span>`;
const d50Cell = t => isNil(t.d50) ? naCell(t)
  : `<span class="rel ${t.d50>0?"up":t.d50<0?"dn":""}">${t.d50>0?"+":""}${(t.d50*100).toFixed(2)}%</span>`;
const baskCell = t => {
  const b = t.bask || [];
  if (!b.length) return naCell(t);
  return `<span class="bask" title="${esc(b.join(" / "))}">${esc(b[0])}${b.length>1?` +${b.length-1}`:""}</span>`;
};

/* 两边都没读数 → 0（交给后面的次级判据）；一边没有 → 它排最后。都有 → null，由调用方比大小 */
const nullLast = (x,y) => {
  const nx = isNil(x), ny = isNil(y);
  if (nx && ny) return 0;
  if (nx) return 1;
  if (ny) return -1;
  return null;
};

const np = (t,d) => d && t.days[d] ? t.days[d].p.length : 0;
const whoOf = t => [...new Set(t.m.filter(m => S.date==="all" || m.d===S.date).map(m => m.h))];

$("#meta").innerHTML = [
  ["窗口", DATES[0].slice(5)+" → "+LAST.slice(5)+"（ET）"],
  ["帖", D.counts.posts], ["发帖人", D.counts.people],
  ["代码", D.counts.cash+" 带 $ / "+D.counts.syms+" 全部"],
  ["墙后", D.wall.length+" 条"],
].map(([k,v]) => `${k} <b>${esc(v)}</b>`).join("");

/* ── 今日变动（原来的重点卡，默认折叠） ── */
$("#flagsum").textContent = `今日变动（${D.highlights.length} 条）`;
$("#flags").innerHTML = D.highlights.length ? D.highlights.map(h => {
  const cls = h.k.startsWith("墙后") ? "wall" : (h.k==="新进"||h.k==="加人") ? "fresh" : "";
  return `<button class="flag ${cls}" data-sym="${esc(h.sym)}">
    <span class="flag-k">${esc(h.k)}</span>
    <span class="flag-s">$${esc(h.sym)}</span>
    <span class="flag-w">${esc(h.why)}</span></button>`;
}).join("") : `<div class="flag"><span class="flag-k">重点</span><span class="flag-w">今天没有触发任何一条判据。</span></div>`;

$("#dates").innerHTML = `<button data-d="all" aria-pressed="true">全部</button>` +
  DATES.map(d => `<button data-d="${d}" aria-pressed="false">${d.slice(5)}</button>`).join("");

/* ── 顶部 curated ──
   四块的候选池统一是「带 $ 且不是指数/ETF」——指数天天有人说，放进来这四块会被它们占满。
   要看指数走势用「含指数」开关看主表。 */
const CAND = () => D.tickers.filter(t => t.cash && !t.idx);
const LAST10 = DATES.slice(-10);

function curPersist(){
  return CAND().map(t => ({ t,
      days: LAST10.filter(d => np(t,d) > 0).length,
      ppl: LAST10.reduce((s,d) => s + np(t,d), 0) }))
    .filter(x => x.days > 0)
    .sort((a,b) => b.days-a.days || b.ppl-a.ppl || b.t.tv-a.t.tv).slice(0,5);
}
function curToday(){
  return CAND().map(t => ({ t, n: np(t,LAST), o: np(t,PREV) })).filter(x => x.n > 0)
    .sort((a,b) => b.n-a.n || b.t.tv-a.t.tv).slice(0,5);
}
function curT5(){
  return CAND().filter(t => (t.mx||0) >= 2 && relv(t,5) !== null)
    .sort((a,b) => relv(b,5)-relv(a,5)).slice(0,5);
}
/* 被 ⭐ 的人在最后一个日期当天的帖。同一条帖会挂在多只票下，按 url 去重后把票合起来。 */
function curStars(){
  const by = new Map();
  for (const t of D.tickers) for (const m of t.m){
    if (m.d !== LAST || !STARS.has(m.h)) continue;
    const k = m.url || (m.h + "|" + m.txt);
    if (!by.has(k)) by.set(k, { h:m.h, txt:m.txt, url:m.url, v:m.v, syms:new Set() });
    by.get(k).syms.add(t.sym);
  }
  return [...by.values()].sort((a,b) => b.v-a.v);
}

function card(title, sub, body){
  return `<section class="card"><h2>${title}</h2><p class="sub">${sub}</p>${body}</section>`;
}
function renderCurated(){
  const bench = esc(D.bench || "SPY");
  const p = curPersist();
  const c1 = card("近 10 日最持续",
    `${esc(LAST10[0].slice(5))} → ${esc(LAST.slice(5))}，按有人说的天数排；并列看总人次。指数/ETF 不计。`,
    p.length ? `<ol>${p.map(x => `<li><button class="ci" data-sym="${esc(x.t.sym)}">
        <span class="s">$${esc(x.t.sym)}</span>
        <span class="txt">10 天里 ${x.days} 天有人说</span>
        <span class="w">${x.ppl} 人次</span></button></li>`).join("")}</ol>`
      : `<p class="none">近 10 天没有一只非指数的票被提到过。</p>`);

  const td = curToday();
  const c2 = card("今天最多人说",
    `${esc(LAST)}（ET）当天提及人数，括号里是对比前日${PREV ? "（" + esc(PREV.slice(5)) + "）" : ""}。`,
    td.length ? `<ol>${td.map(x => { const d = x.n - x.o;
      return `<li><button class="ci" data-sym="${esc(x.t.sym)}">
        <span class="s">$${esc(x.t.sym)}</span>
        <span class="txt">${x.n} 人</span>
        <span class="w">${d>0?"+"+d:d<0?String(d):"持平"}</span></button></li>`; }).join("")}</ol>`
      : `<p class="none">最后一天没有非指数的票被提到。</p>`);

  const t5 = curT5();
  const c3 = card(`T+5 涨幅最大 vs ${bench}`,
    `峰值日锚点往后 5 个交易日，个股收益减 ${bench} 同期收益。只取有读数、且至少 2 人说过的。`,
    t5.length ? `<ol>${t5.map(t => `<li><button class="ci" data-sym="${esc(t.sym)}">
        <span class="s">$${esc(t.sym)}</span>
        <span class="txt">峰值日 ${esc(t.peak ? t.peak.slice(5) : "—")}</span>
        <span class="w">${relv(t,5)>0?"+":""}${relv(t,5).toFixed(2)}%</span></button></li>`).join("")}</ol>`
      : `<p class="none">还没有一只票同时满足「≥2 人说过」和「T+5 已到期且有行情」。</p>`);

  const sp = curStars();
  const c4 = card("⭐ 我关注的人今天说了什么",
    STARS.size ? `已关注 ${STARS.size} 人 · ${esc(LAST)}（ET）当天${sp.length ? "共 " + sp.length + " 条" : "没发带票的帖"}。`
               : `这一块只列你 ⭐ 过的人。`,
    !STARS.size ? `<p class="none">点任意 handle 旁的 ⭐ 把他加进来（人视图每行、主表「谁在说」列、页底人员名单都有）。</p>`
    : sp.length ? `<ol>${sp.slice(0,5).map(x => `<li class="ciw"><button class="ci" data-sym="${esc([...x.syms][0])}">
        <span class="s">@${esc(x.h)}</span>
        <span class="txt">${esc([...x.syms].slice(0,3).map(s => "$"+s).join(" "))} ${esc(x.txt.slice(0,70))}</span>
        </button>${x.url ? `<a class="ext" href="${esc(x.url)}" target="_blank" rel="noopener" title="原帖">↗</a>` : ""}</li>`).join("")}${sp.length>5 ? `<li class="none">还有 ${sp.length-5} 条，去「人」视图看。</li>` : ""}</ol>`
    : `<p class="none">你关注的这 ${STARS.size} 人，${esc(LAST)} 当天没有带票的帖。</p>`);

  $("#curated").innerHTML = c1 + c2 + c3 + c4;
}

/* ── 人员名单（页底，默认折叠） ── */
function renderRoster(){
  $("#rostersum").textContent = `人员名单（${D.people.length} 人）`;
  $("#roster").innerHTML = D.people.map(p =>
    `<div class="rp">${starBtn(p.h)}<span class="h">@${esc(p.h)}</span>
      <span class="n">${p.posts} 帖</span></div>`).join("");
}

function spark(t){
  const all = DATES.map(d => np(t,d));
  const vals = all.slice(-SPARK_N), mx = Math.max(1, ...vals);
  const full = DATES.map((d,i) => `${d.slice(5)} ${all[i]}`).join("  ");
  return `<div class="spark" role="img" title="全 ${DATES.length} 天：${esc(full)}"` +
    ` aria-label="近 ${vals.length} 天提及人数 ${vals.join("、")}；全 ${DATES.length} 天 ${esc(full)}">` +
    vals.map((v,i) => `<span class="${v===0?"zero":""}${i===vals.length-1&&v>0?" last":""}" style="height:${v?Math.round(3+v/mx*15):2}px" title="${SPARK_DATES[i]}：${v} 人"></span>`).join("") + `</div>`;
}
const stChip = ([k,n]) => `<i class="${FWD.has(k)?"f":DONE.has(k)?"d":"n"}">${esc(k)} ${n}</i>`;
const stSorted = t => Object.entries(t.st).sort((a,b) => b[1]-a[1]);
function stanceCells(t){
  const e = stSorted(t);
  if (!e.length) return `<span class="st"><i class="n">未标</i></span>`;
  const full = e.map(([k,n]) => `${k} ${n}`).join(" · ");
  return `<span class="st" title="${esc(full)}">` + e.slice(0,2).map(stChip).join("") +
    (e.length > 2 ? `<i class="more">+${e.length-2}</i>` : "") + `</span>`;
}
function wallCell(t){
  if (!t.wall.length) return "";
  const kinds = [...new Set(t.wall.map(w => w.kind).filter(Boolean))].join("/");
  const last = t.wall[t.wall.length-1];
  return `<span class="wallmark" title="@jfsrev 墙后 ${esc(last.d)}">${esc(kinds||"墙后")}</span>`;
}

const colOf = (v,k) => COLS[v].find(c => c.k === k) || COLS[v][0];

/* ── 列开关 ──
   「代码」列不可关（它是 sticky 首列，也是唯一的身份列）。
   选择存这台浏览器的 localStorage；和 ⭐ 一样，读写各包一层 try——
   隐私窗口 / 站点数据被清 / 策略禁用时抛出，就当「全开」，页面照常渲染。 */
const COL_KEY = "xboard.cols.v1";
const COL_LOCKED = new Set(["sym"]);
const COL_KEEP = new Set(["sym","today","delta","st","t5","who"]);   // 「只留常用」留下的
function loadCols(){
  try{
    const a = JSON.parse(window.localStorage.getItem(COL_KEY) || "[]");
    return new Set(Array.isArray(a) ? a.filter(x => typeof x === "string" && !COL_LOCKED.has(x)) : []);
  }catch(e){ return new Set(); }
}
function saveCols(){
  try{ window.localStorage.setItem(COL_KEY, JSON.stringify([...HIDDEN])); }catch(e){}
}
let HIDDEN = loadCols();
const visCols = v => v === "t" ? COLS.t.filter(c => !HIDDEN.has(c.k)) : COLS[v];

function sorter(v){
  const o = S.ord[v], c = colOf(v, o.k), dir = o.dir;
  return (a,b) => {
    const x = c.val(a), y = c.val(b);
    const nl = nullLast(x,y);
    if (nl !== null) return nl || (c.tie ? c.tie(a,b) : 0);
    const base = (typeof x === "string") ? String(x).localeCompare(String(y)) : (x - y);
    return (base * dir) || (c.tie ? c.tie(a,b) : 0);
  };
}
function headRow(v){
  const o = S.ord[v];
  return "<tr>" + visCols(v).map(c => {
    const on = c.k === o.k;
    const aria = on ? (o.dir === 1 ? "ascending" : "descending") : "none";
    const arrow = on ? `<span class="dir">${o.dir === 1 ? "▲" : "▼"}</span>` : "";
    return `<th class="${c.cls||""}" aria-sort="${aria}"${c.title?` title="${c.title}"`:""}>` +
      `<button class="sortbtn" data-k="${c.k}" type="button">${c.label} ${arrow}</button></th>`;
  }).join("") + "</tr>";
}
/* 点表头：同一列再点一次翻向，换列则用该列的默认方向。 */
function clickHead(k){
  const o = S.ord[S.v];
  if (o.k === k) o.dir = -o.dir;
  else { o.k = k; o.dir = colOf(S.v,k).dir0; }
  if (S.v === "t") syncSelect();
  render();
}
/* 下拉与表头双向同步。下拉里没有的列，落到那个「（点表头排的）」选项上并写出列名。 */
const SELECT_KEYS = new Set(["today","total","views","sym","t5","rs","d50","bask"]);
function syncSelect(){
  const o = S.ord.t, opt = $("#optcol");
  if (SELECT_KEYS.has(o.k) && o.dir === colOf("t",o.k).dir0){
    $("#sort").value = o.k; opt.textContent = "（点表头排的）";
  } else {
    opt.textContent = `表头：${colOf("t",o.k).label} ${o.dir===1?"▲":"▼"}`;
    $("#sort").value = "__col";
  }
}

/* 搜索词归一：去掉用户顺手打的 $ # @，统一小写。
   有搜索词时「只看 $」「含指数」「只看墙后」三个筛选一律让路——
   搜 $XLK 却因为它被归进指数而空表，是 09-22 Andy 撞上的那个 bug。 */
const normQ = q => q.trim().replace(/^[$#@]+/, "").toLowerCase();
const textHit = (t, q) => {
  const re = new RegExp("(^|[^a-z0-9])[$#]?" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "([^a-z0-9]|$)", "i");
  return t.m.some(m => re.test(m.txt));
};
let SEARCH_MODE = "";
function tickers(){
  const q = normQ(S.q);
  SEARCH_MODE = "";
  const passes = t => !(S.cash && !t.cash) && !(!S.idx && t.idx) &&
                      !(S.wallonly && !t.wall.length) && !(!S.solo && (t.mx||0) < 2);
  const base = D.tickers.filter(t => S.date === "all" || t.days[S.date]);
  let r = base.filter(passes);
  if (q){
    /* 代码命中：筛选让路。只按人名命中：筛选照旧，否则裸码噪声全放出来。 */
    r = base.filter(t => t.sym.toLowerCase().includes(q) ||
                         (passes(t) && t.m.some(m => m.h.toLowerCase().includes(q))));
    SEARCH_MODE = "sym";
    if (!r.length && q.length >= 2){
      r = base.filter(t => textHit(t, q));
      SEARCH_MODE = "text";
    }
  }
  r.sort(sorter("t"));
  if (q) r.sort((a,b) => (b.sym.toLowerCase()===q) - (a.sym.toLowerCase()===q));
  return r;
}

function wallPub(w){
  return w.tickers.map(s => { const t = D.tickers.find(x => x.sym === s); return t ? np(t, w.d) : 0; });
}

  } else if (S.v === "p"){

    tb.innerHTML = rows.length ? rows.map(p => `<tr><td class="sym">${starBtn(p.h)}@${esc(p.h)}</td>

        <td class="num">${nf(w.views)}</td></tr>` +
        (open ? `<tr class="detail"><td colspan="7"><div class="posts"><div class="full wbody">${

          body ? lines(body) : "（这条没有正文，只有图）"}${
          w.url ? `<br><a href="${esc(w.url)}" target="_blank" rel="noopener">原帖 ↗</a>` : ""}</div></div></td></tr>` : "");
    }).join("") : `<tr><td colspan="7" class="empty">没有符合的条目。</td></tr>`;
    $("#note").innerHTML = `付费订阅内容，<b>看板上直接显示正文</b>（Andy 2026-09-24 取消「只存不引」）——
      正文列点一下展开全文，票视图里展开任何一只票也能读到铜色那几条。

/* ── 横滚三件套：顶部同步条 · Shift+滚轮/键盘 · 边缘渐隐 ── */
const SC = $("#scroll"), XT = $("#xtop"), XTI = $("#xtopin");
/* 两条互相 set scrollLeft，天然有回声。重入保护三层，缺一都可能抖：
   ① lock：正在同步时进来的 scroll 事件直接返回，不再回写；
   ② 差值门槛：只有相差 ≥1px 才写，子像素差不触发下一轮；
   ③ 等长 + 末端对齐：把顶部条的内容宽设成「表宽 − 盒可视宽 + 条可视宽」，
      让两边的 maxScrollLeft 尽量相等（子像素取整后仍可能差 1–3px，做不到恒等）；
      **真正兜住的是末端对齐** —— 一边已经到自己的最右时，另一边直接写它自己的最右，
      不照抄那个对不上的数。否则滚到最右时一边会被 clamp 成另一个值，两边互相往回拽，
      那才是真正会自激的形状（盒子有纵向滚动条，可视宽本来就比顶条窄）。
   XSYNC 计数供验收数事件次数：top/box = 收到的 scroll 事件，applied = 真正写回的次数。 */
const XSYNC = { lock:false, top:0, box:0, applied:0, wheel:0, key:0 };
window.__xsync = XSYNC;
function syncScrollGeom(){
  const w = Math.max(0, $("#tbl").scrollWidth - SC.clientWidth) + XT.clientWidth;
  XTI.style.width = Math.round(w) + "px";
  /* 一次性校正：边框/子像素会让两边的 maxScrollLeft 差几 px，差多少就把空条加长/缩短多少。
     校正后两边完全等长，滚到最右时谁都不会被 clamp 成另一个值（那才是会自激的形状）。 */
  let cur = w;
  for (let i = 0; i < 3; i++){
    const d = (SC.scrollWidth - SC.clientWidth) - (XT.scrollWidth - XT.clientWidth);
    if (!d) break;
    cur = Math.max(0, cur + d);
    XTI.style.width = cur + "px";
  }
  layoutThumb(); updateFades();
}

/* 顶部把手：位置/宽度只读 SC 的三个数，自己从不写 SC —— 写只发生在用户拖它的时候，
   那一路走 XT.scrollLeft，再由上面那条 mirror 同步到 SC。 */
function layoutThumb(){
  const max = SC.scrollWidth - SC.clientWidth;
  const bar = $("#xbar"), th = $("#xthumb");
  bar.classList.toggle("off", max <= 0);
  if (max <= 0) return;
  const track = bar.clientWidth;
  const tw = Math.max(32, Math.round(track * SC.clientWidth / SC.scrollWidth));
  th.style.width = tw + "px";
  th.style.left = Math.round((SC.scrollLeft / max) * (track - tw)) + "px";
  bar.setAttribute("aria-valuenow", Math.round(SC.scrollLeft / max * 100));
}
/* 拖把手 / 点轨道。两者都只 set XT.scrollLeft，走同一条同步路径。 */
(function thumbDrag(){
  const bar = $("#xbar"), th = $("#xthumb");
  let from = 0, at = 0;
  const geo = () => {
    const max = SC.scrollWidth - SC.clientWidth, track = bar.clientWidth;
    return { max, track, tw: th.offsetWidth, run: Math.max(1, track - th.offsetWidth) };
  };
  const moveTo = px => { const g = geo();
    XT.scrollLeft = Math.max(0, Math.min(g.max, px / g.run * g.max)); };
  th.addEventListener("pointerdown", e => {
    e.preventDefault(); th.classList.add("drag"); th.setPointerCapture(e.pointerId);
    from = e.clientX; at = parseFloat(th.style.left) || 0;
  });
  th.addEventListener("pointermove", e => {
    if (!th.classList.contains("drag")) return;
    moveTo(at + (e.clientX - from));
  });
  for (const ev of ["pointerup","pointercancel"])
    th.addEventListener(ev, e => { th.classList.remove("drag"); try{ th.releasePointerCapture(e.pointerId); }catch(_){} });
  bar.addEventListener("pointerdown", e => {
    if (e.target === th) return;
    const g = geo(), x = e.clientX - bar.getBoundingClientRect().left;
    moveTo(x - g.tw / 2);
  });
})();
function mirror(from, to, key){
  XSYNC[key]++;
  if (XSYNC.lock) return;
  XSYNC.lock = true;
  const fMax = from.scrollWidth - from.clientWidth, tMax = to.scrollWidth - to.clientWidth;
  const want = from.scrollLeft >= fMax - 1 ? tMax : from.scrollLeft;
  if (Math.abs(to.scrollLeft - want) >= 1){ to.scrollLeft = want; XSYNC.applied++; }
  XSYNC.lock = false;
  layoutThumb(); updateFades();
}
XT.addEventListener("scroll", () => mirror(XT, SC, "top"));
SC.addEventListener("scroll", () => mirror(SC, XT, "box"));

/* 渐隐：右边还有列 → 右侧一道；已经滚出去了 → 左侧一道。
   左侧那道从首列右缘起画（首列 sticky，永远在，压它没意义）。 */
function updateFades(){
  const max = SC.scrollWidth - SC.clientWidth, x = SC.scrollLeft;
  $("#fadeL").classList.toggle("on", x > 1);
  $("#fadeR").classList.toggle("on", x < max - 1);
  const c1 = SC.querySelector("tbody td:first-child") || SC.querySelector("thead th:first-child");
  const w = c1 ? Math.round(c1.getBoundingClientRect().width) : 0;
  document.documentElement.style.setProperty("--c1w", (w + 1) + "px");
}

/* Shift + 滚轮 = 横滚（触控板双指横扫本来就走 deltaX，这条是给鼠标用户的）。 */
SC.addEventListener("wheel", e => {
  if (!e.shiftKey) return;
  const d = e.deltaX || e.deltaY;
  if (!d || SC.scrollWidth - SC.clientWidth <= 0) return;
  SC.scrollLeft += d; XSYNC.wheel++; e.preventDefault();
}, {passive:false});

/* 键盘：← → 一屏的 80%，Home/End 到两端。输入框/下拉里的按键不抢。 */
SC.addEventListener("keydown", e => {
  if (e.target.closest("input,select,textarea")) return;
  const max = SC.scrollWidth - SC.clientWidth;
  const page = Math.max(60, Math.round(SC.clientWidth * 0.8));
  let to = null;
  if (e.key === "ArrowRight") to = Math.min(max, SC.scrollLeft + page);
  else if (e.key === "ArrowLeft") to = Math.max(0, SC.scrollLeft - page);
  else if (e.key === "Home") to = 0;
  else if (e.key === "End") to = max;
  if (to === null) return;
  e.preventDefault(); SC.scrollLeft = to; XSYNC.key++;
});

/* ── 列菜单 ── */
function renderColMenu(){
  const on = COLS.t.length - HIDDEN.size;
  $("#colsum").textContent = `列 ${on}/${COLS.t.length}`;
  $("#colpop").innerHTML = COLS.t.map(c =>
    `<label class="colopt"><input type="checkbox" data-k="${c.k}"` +
    `${HIDDEN.has(c.k) ? "" : " checked"}${COL_LOCKED.has(c.k) ? " disabled" : ""}>` +
    `<span>${c.label}${COL_LOCKED.has(c.k) ? "（固定）" : ""}</span></label>`).join("") +
    `<div class="colact"><button type="button" data-act="all">全开</button>` +
    `<button type="button" data-act="min">只留常用</button></div>`;
}
$("#colpop").addEventListener("change", e => {
  const cb = e.target.closest("input[type=checkbox]"); if (!cb) return;
  const k = cb.dataset.k; if (COL_LOCKED.has(k)) return;
  cb.checked ? HIDDEN.delete(k) : HIDDEN.add(k);
  saveCols(); renderColMenu(); render();
});
$("#colpop").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  HIDDEN = b.dataset.act === "all" ? new Set()
         : new Set(COLS.t.filter(c => !COL_KEEP.has(c.k)).map(c => c.k));
  saveCols(); renderColMenu(); render();
});

function detail(t){
  const ms = t.m.filter(m => S.date === "all" || m.d === S.date);
  const who = whoOf(t);
  const seq = DATES.map(d => `${d.slice(5)} ${np(t,d)}`).join("　");
  const st = stSorted(t);
  const head = `<div class="full"><b>全 ${DATES.length} 天人数</b> <span class="seq">${esc(seq)}</span>
    <br><b>全部立场（${st.length}）</b> ${st.length ? `<span class="st" style="flex-wrap:wrap;white-space:normal">${st.map(stChip).join("")}</span>` : "未标"}
    <br><b>ETF 篮子</b> ${(t.bask||[]).length ? esc(t.bask.join(" / ")) : (t.idx ? "不适用（ETF/指数）" : "无读数")}
    <br><b>谁在说（${who.length}）</b> ${who.map(h => `${starBtn(h)}@${esc(h)}`).join(" ") || "—"}</div>`;
  const wall = t.wall.map(w => {
    const body = wtxt(w);
    return `<div class="post wallp">
      <span class="d mono">${esc(w.d)}</span><span class="h">@jfsrev · 墙后</span>
      <span class="t"><b>${esc(w.kind)}</b>${w.proxy ? " · 代理 "+esc(w.proxy) : ""}${
        body ? `<div class="wbody">${lines(body)}</div>` : ""}${
        w.url ? ` <a href="${esc(w.url)}" target="_blank" rel="noopener">原帖 ↗</a>` : ""}</span>
      <span class="v">${w.v ? nf(w.v)+" 曝光" : "—"}</span></div>`;
  }).join("");
  return head + wall + (ms.map(m => `<div class="post">
      <span class="d mono">${esc(m.d.slice(5))}${m.rep ? " · 回复" : ""}</span>
      <span class="h">${starBtn(m.h)}@${esc(m.h)}${m.st ? ` <i class="st"><i class="${FWD.has(m.st)?"f":DONE.has(m.st)?"d":"n"}">${esc(m.st)}</i></i>` : ""}</span>
      <span class="t">${esc(m.txt)} ${m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">原帖 ↗</a>` : ""}</span>
      <span class="v">${nf(m.v)} 曝光 · ${m.bk} 收藏</span></div>`).join("") || `<div class="post"><span class="t">这一天没有公开区提及。</span></div>`);
}

/* 跳到某只票：curated 与重点卡共用。 */
function gotoSym(sym){
  S.v = "t"; S.q = sym; S.idx = true; S.date = "all"; S.solo = true;
  $("#solo").setAttribute("aria-pressed", true);
  $("#q").value = sym; $("#idx").setAttribute("aria-pressed", true);
  [...$("#views").children].forEach(x => x.setAttribute("aria-pressed", x.dataset.v === "t"));
  [...$("#dates").children].forEach(x => x.setAttribute("aria-pressed", x.dataset.d === "all"));
  S.open.add(sym); render();
  $("#tbl").scrollIntoView({block:"start"});
}
/* ⭐ 切换：只重画依赖它的两处，不重建整页。 */
function toggleStar(h){
  STARS.has(h) ? STARS.delete(h) : STARS.add(h);
  saveStars(); renderCurated(); renderRoster(); render();
}

/* 事件 */
$("#q").addEventListener("input", e => { S.q = e.target.value.trim(); render(); });
$("#views").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  S.v = b.dataset.v;
  [...$("#views").children].forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
$("#dates").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  S.date = b.dataset.d;
  [...$("#dates").children].forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
for (const [id, key] of [["#cash","cash"],["#idx","idx"],["#wallonly","wallonly"],["#solo","solo"]]){
  $(id).addEventListener("click", e => {
    S[key] = !S[key]; e.currentTarget.setAttribute("aria-pressed", S[key]); render();
  });
}
$("#sort").addEventListener("change", e => {
  if (e.target.value === "__col"){ syncSelect(); return; }   // 这一项只是回显，不是可选项
  S.ord.t.k = e.target.value; S.ord.t.dir = colOf("t", e.target.value).dir0;
  syncSelect(); render();
});
$("#thead").addEventListener("click", e => {
  const b = e.target.closest("button.sortbtn"); if (b) clickHead(b.dataset.k);
});
$("#curated").addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const b = e.target.closest(".ci"); if (b && b.dataset.sym) gotoSym(b.dataset.sym);
});
$("#flags").addEventListener("click", e => {
  const b = e.target.closest(".flag"); if (b && b.dataset.sym) gotoSym(b.dataset.sym);
});
$("#roster").addEventListener("click", e => {
  const b = e.target.closest(".star"); if (b) toggleStar(b.dataset.h);
});
function toggle(el){
  const wid = el.dataset.wid;
  if (wid){ S.openw.has(wid) ? S.openw.delete(wid) : S.openw.add(wid); render(); return; }
  const sym = el.dataset.sym; if (!sym) return;
  S.open.has(sym) ? S.open.delete(sym) : S.open.add(sym); render();
}
$("#tbody").addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const s = e.target.closest(".star");
  if (s){ e.stopPropagation(); toggleStar(s.dataset.h); return; }
  const r = e.target.closest("tr.row"); if (r) toggle(r);
});
$("#tbody").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  if (e.target.closest(".star")) return;            // ⭐ 自己是 button，按键交给它
  const r = e.target.closest("tr.row"); if (r){ e.preventDefault(); toggle(r); }
});

/* 工具条高度随换行（窄屏日期钮/筛选钮会多占几行）而变，写死任何一个 px 都会错。
   现场量，写进 --barh，表格容器的最大高度与表头吸顶都读它。 */
function syncBarHeight(){
  const h = Math.ceil($(".bar").getBoundingClientRect().height);
  document.documentElement.style.setProperty("--barh", h + "px");
}
if (window.ResizeObserver) new ResizeObserver(syncBarHeight).observe($(".bar"));
addEventListener("resize", () => { syncBarHeight(); syncScrollGeom(); });
if (window.ResizeObserver) new ResizeObserver(syncScrollGeom).observe($("#scroll"));

renderCurated(); renderRoster(); renderColMenu(); syncSelect(); render(); syncBarHeight(); syncScrollGeom();
</script>
